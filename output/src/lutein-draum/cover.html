<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<style>

@font-face{font-family:K;font-weight:800;src:url(kanit-latin-800-normal.woff2)}
@font-face{font-family:K;font-weight:900;src:url(kanit-latin-900-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1440px;height:1080px;overflow:hidden;background:#fff}
body{font-family:K,sans-serif;color:#1B2A4A}
#stage{position:relative;width:1440px;height:1080px;overflow:hidden;background:#FFF6E9}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.sbg{position:absolute;inset:-60px}
.sun{background:radial-gradient(circle at 50% 45%,#FFFCEB 0%,#FFEFA8 50%,#FFC94A 100%)}
.sky{background:linear-gradient(180deg,#9EDBFF 0%,#D8F2FF 60%,#FFF6DA 100%)}
.vessel{background:radial-gradient(circle at 50% 46%,#FFE3E3 0%,#FFAFB5 30%,#F27A88 65%,#C9455A 100%)}
.retina{background:radial-gradient(circle at 50% 30%,#FFF0DE 0%,#FFD0A8 50%,#F7A57C 100%)}
.split{background:linear-gradient(90deg,#C8E2FF 0%,#DCE9FF 44%,#FFE2E6 56%,#FFC9D3 100%)}
.garden{background:linear-gradient(180deg,#8FD8FF 0%,#D9F3FF 55%,#FFF4C9 100%)}
.night{background:linear-gradient(180deg,#5E56B8 0%,#8C84DA 60%,#B7AEF0 100%)}
.morning{background:linear-gradient(180deg,#FFE6C7 0%,#FFF4E2 60%,#FFE9D2 100%)}
.desk{background:linear-gradient(180deg,#CFF5E6 0%,#E9FBF4 70%,#D9F2E8 100%)}
.ocean{background:radial-gradient(circle at 50% 45%,#C9EEFF 0%,#8AD3FA 60%,#5BB6EE 100%)}
.oil{background:radial-gradient(circle at 50% 40%,#FFFBEA 0%,#FFEBB0 55%,#FFCF6A 100%)}
.cam{position:absolute;inset:0;will-change:transform}
.a{position:absolute;opacity:0;will-change:transform}
.img{background-position:center;background-size:contain;background-repeat:no-repeat}
.pouch{background-image:url(pouch.png);filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 22px 26px rgba(40,50,90,.35))}
.kt{position:absolute;left:130px;width:1180px;text-align:center;font-weight:900;white-space:nowrap;line-height:1.25;color:#FFD23F;-webkit-text-stroke:14px #1B2A4A;paint-order:stroke fill;text-shadow:0 12px 0 #1B2A4A}
.kt .g{display:inline-block;transform-origin:50% 80%;opacity:0}
.stk{display:inline-block;padding:8px 34px 14px;border-radius:999px;font-weight:900;white-space:nowrap;line-height:1.2;border:7px solid #1B2A4A;box-shadow:0 10px 0 #1B2A4A}
.dot{position:absolute;border-radius:50%}
.ring{position:absolute;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;border:16px solid #fff;opacity:0}
.conf{position:absolute;width:20px;height:30px;border-radius:6px}
.rays{position:absolute;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.75) 0 9deg,rgba(255,255,255,0) 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%)}
#stripe{position:absolute;top:-200px;width:3000px;height:1500px;transform:translateX(-3600px) skewX(-14deg);z-index:80}
#stripe div{position:absolute;top:0;bottom:0;width:160px}
svg{overflow:visible}
.photo{position:absolute;border-radius:26px;overflow:hidden;border:9px solid #fff;box-shadow:0 0 0 7px #1B2A4A,0 22px 40px rgba(27,42,74,.35)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eyebg{background:radial-gradient(circle at 55% 45%,#FFF7FA 0%,#FFE3EC 55%,#FFC6D6 100%)}
#annL{position:absolute;left:0;top:0;z-index:70;pointer-events:none}

.box{position:absolute;left:330px;top:150px;width:780px;height:780px;border:4px dashed #f0f;display:none}
</style></head><body><div id="stage">
<div class="sbg" style="inset:0;background:radial-gradient(circle at 50% 58%,#FFFFFF 0%,#D7F1FF 45%,#8FD3FF 100%)"></div>
<div class="rays" style="left:420px;top:310px;width:600px;height:600px;transform:rotate(8deg)"></div>
<div style="position:absolute;left:330px;top:140px;width:780px;height:300px"><svg width="780" height="300" viewBox="0 0 780 300"><path id="burst" fill="#FFE14D" stroke="#1B2A4A" stroke-width="9" stroke-linejoin="round"/></svg></div>
<div class="kt" style="top:178px;font-size:70px;color:#fff">วิตามินตัวนี้ รู้ได้ไง</div>
<div class="kt" style="top:262px;font-size:100px;color:#E8231F">ว่าต้องไปที่ตา?</div>
<svg style="position:absolute;left:0;top:0" width="1440" height="1080">
 <g transform="translate(660 610) scale(1.1)" id="eye"></g>

 <path d="M600 820 C 580 790 590 765 615 752" fill="none" stroke="#1B2A4A" stroke-width="10" stroke-dasharray="2 22" stroke-linecap="round"/>
 <path d="M590 742 L620 750 L606 778" fill="none" stroke="#1B2A4A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
 <g id="d1" transform="translate(470 905) rotate(-8) scale(0.92)"></g><g id="d2" transform="translate(575 908) rotate(8) scale(0.92)"></g>
 <text x="905" y="545" text-anchor="middle" font-family="K" font-weight="900" font-size="170" fill="#E8231F" stroke="#1B2A4A" stroke-width="12" paint-order="stroke fill" transform="rotate(12 905 480)">?</text>
 <text x="425" y="560" text-anchor="middle" font-family="K" font-weight="900" font-size="110" fill="#7FD3FF" stroke="#1B2A4A" stroke-width="10" paint-order="stroke fill" transform="rotate(-12 425 505)">?</text>
</svg>
<div class="img pouch" style="left:905px;top:650px;width:160px;height:252px;position:absolute;transform:rotate(6deg)"></div>
<div class="box" id="box"></div>
</div><script>
const W=1440,H=1080,INK='#1B2A4A',NS='http://www.w3.org/2000/svg';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOC=p=>1-Math.pow(1-p,3);
const eOB=p=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const eIO=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const eBn=p=>{const n=7.5625,d=2.75;if(p<1/d)return n*p*p;if(p<2/d)return n*(p-=1.5/d)*p+.75;if(p<2.5/d)return n*(p-=2.25/d)*p+.9375;return n*(p-=2.625/d)*p+.984375};
let seed=29;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const $=id=>document.getElementById(id);
if(location.hash==='#safe')$('safe').style.display='block';
const mk=(tag,at,par)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e};
const H$=(par,html)=>{const g=mk('g',{},par);g.innerHTML=html;return g};

function dropSvg(c,h=120,o={}){const k=h/120;const sad=o.sad;
 return `<g transform="scale(${k})">${o.arms?`<path d="M-40 -46 L-70 -${o.armsUp?96:30}M40 -46 L70 -${o.armsUp?96:30}" stroke="${INK}" stroke-width="12" stroke-linecap="round"/>`:''}
 <path d="M0 -120 C 18 -86 52 -64 52 -34 A52 52 0 0 1 -52 -34 C -52 -64 -18 -86 0 -120Z" fill="${c}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
 <ellipse cx="-20" cy="-70" rx="8" ry="14" fill="#fff" opacity=".7" transform="rotate(25 -20 -70)"/>
 <circle cx="-15" cy="-40" r="6" fill="${INK}"/><circle cx="15" cy="-40" r="6" fill="${INK}"/>
 ${sad?`<path d="M-10 -18q10-8 20 0" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`:`<path d="M-12 -26q12 12 24 0" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`}
 <ellipse cx="-28" cy="-28" rx="7" ry="4" fill="#FF6B6B" opacity=".5"/><ellipse cx="28" cy="-28" rx="7" ry="4" fill="#FF6B6B" opacity=".5"/></g>`}
const LUT='#FF9F1C',ZEA='#FFD23F';
function eyeSvg(w=220,o={}){const h=w*0.55;return `<g class="eyeg"><path d="M${-w/2} 0 Q0 ${-h} ${w/2} 0 Q0 ${h} ${-w/2} 0Z" fill="#fff" stroke="${INK}" stroke-width="8"/>
 <g class="iris"><circle r="${h*0.48}" fill="${o.iris||'#4AA8FF'}" stroke="${INK}" stroke-width="6"/><circle r="${h*0.22}" fill="${INK}"/><circle cx="${h*0.14}" cy="${-h*0.16}" r="${h*0.1}" fill="#fff"/></g>
 ${o.lash!==false?`<path d="M${-w*0.3} ${-h*0.36}l-14 -26M0 ${-h*0.5}v-30M${w*0.3} ${-h*0.36}l14 -26" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`:''}
 <path class="lid" d="M${-w/2} 0 Q0 ${-h} ${w/2} 0 Q0 ${-h} ${-w/2} 0Z" fill="#FFD7B5" stroke="${INK}" stroke-width="6"/></g>`}

{let d='';const n=24;for(let i=0;i<=n*2;i++){const a=i/(n*2)*Math.PI*2;const r=i%2?1:0.86;d+=(i?'L':'M')+(390+Math.cos(a)*385*r).toFixed(1)+' '+(150+Math.sin(a)*148*r).toFixed(1)}$('burst').setAttribute('d',d+'Z')}
$('eye').innerHTML=eyeSvg(300);document.querySelector('.lid').style.display='none';
$('d1').innerHTML=dropSvg(LUT,120,{arms:true,armsUp:true});$('d2').innerHTML=dropSvg(ZEA,120,{arms:true,armsUp:true});
window.scrollTo(0,0);$("stage").scrollTop=0;if(location.hash==='#box')$('box').style.display='block';
document.querySelectorAll('.kt').forEach(e=>{e.style.left='330px';e.style.width='780px'});
</script></body></html>
