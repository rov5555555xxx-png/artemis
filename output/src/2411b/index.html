<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:K;font-weight:600;src:url(kanit-thai-600-normal.woff2);unicode-range:U+0E00-0E7F}
@font-face{font-family:K;font-weight:600;src:url(kanit-latin-600-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:K;font-weight:800;src:url(kanit-thai-800-normal.woff2);unicode-range:U+0E00-0E7F}
@font-face{font-family:K;font-weight:800;src:url(kanit-latin-800-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:K;font-weight:900;src:url(kanit-thai-900-normal.woff2);unicode-range:U+0E00-0E7F}
@font-face{font-family:K;font-weight:900;src:url(kanit-latin-900-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
html,body{margin:0;background:#1e1f22;overflow:hidden}
#st{position:relative;width:1080px;height:1080px;overflow:hidden;
 background:radial-gradient(ellipse 75% 65% at 50% 42%,#45474b 0%,#303236 45%,#1d1e21 100%)}
#sv{position:absolute;inset:0}
#cap{position:absolute;left:0;right:0;top:880px;height:110px;display:flex;align-items:center;justify-content:center;
 font:800 66px/1.15 K;color:#fff;text-shadow:0 4px 10px rgba(0,0,0,.55);white-space:nowrap}
#cap .y{color:#ffd23f}
#cap .rb{background:#e2332f;color:#fff;border-radius:14px;padding:0 22px 6px;text-shadow:none;box-shadow:0 6px 14px rgba(0,0,0,.35)}
#cap span.w{display:inline-block}
.safe #st::after{content:'';position:absolute;inset:70px;border:2px dashed #0f0;pointer-events:none}
</style></head><body>
<div id="st"><svg id="sv" width="1080" height="1080" viewBox="0 0 1080 1080"></svg><div id="cap"></div></div>
<svg width="0" height="0" style="position:absolute"><path id="meas" d="M0,0"/></svg>
<script>
if(location.hash=='#safe')document.body.classList.add('safe');
const CH='#f2efe6',INK='#34363a',YEL='#ffd23f',RED='#e2332f',GRN='#2faa58',BLU='#7fa3d6';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,d)=>d<=0?(t>=a?1:0):cl((t-a)/d);
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{x=cl(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,a,d=.35)=>eb(P(t,a,d));
const lerp=(a,b,p)=>a+(b-a)*p;
let UID=0;const uid=()=>'u'+(UID++);
const meas=document.getElementById('meas');
function ptAt(d,p){meas.setAttribute('d',d);const L=meas.getTotalLength();const q=meas.getPointAtLength(L*cl(p));return {x:q.x,y:q.y};}
const cvs=document.createElement('canvas').getContext('2d');
function tw(txt,size,wt=800){cvs.font=`${wt} ${size}px K`;return cvs.measureText(txt).width;}

// ---------- primitives ----------
function ch(d,p,w=7,c=CH,extra=''){if(p<=0)return '';return `<path d="${d}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${1-p}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" filter="url(#chf)" ${extra}/>`;}
function g(inner,{x=0,y=0,s=1,r=0,o=1}={}){if(o<=0.001||!inner)return '';return `<g transform="translate(${x},${y}) rotate(${r}) scale(${s})" opacity="${o}">${inner}</g>`;}
function coin(x,y,r,lab,fill='#efe9da',tc=INK,fs){fs=fs||r*.72;return `<g><circle cx="${x}" cy="${y+4}" r="${r}" fill="rgba(0,0,0,.35)"/><circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#2a2b2e" stroke-width="3"/><text x="${x}" y="${y+fs*.36}" font-family="K" font-weight="800" font-size="${fs}" text-anchor="middle" fill="${tc}">${lab}</text></g>`;}
function capsule(x,y,L,ang,kind='plain',o=1){const h=L*.42,r=h/2;let s=`<g transform="translate(${x},${y}) rotate(${ang})" opacity="${o}">`;
 s+=`<rect x="${-L/2+3}" y="${-r+6}" width="${L}" height="${h}" rx="${r}" fill="rgba(0,0,0,.35)"/>`;
 if(kind=='plain'){s+=`<path d="M0,${-r} H${L/2-r} A${r},${r} 0 0 1 ${L/2-r},${r} H0Z" fill="#9ca2aa" stroke="#2a2b2e" stroke-width="3"/><path d="M0,${-r} H${-L/2+r} A${r},${r} 0 0 0 ${-L/2+r},${r} H0Z" fill="#f2eee4" stroke="#2a2b2e" stroke-width="3"/>`;}
 else if(kind=='white'){s+=`<rect x="${-L/2}" y="${-r}" width="${L}" height="${h}" rx="${r}" fill="#f4f2ec" stroke="#2a2b2e" stroke-width="3"/><line x1="0" y1="${-r}" x2="0" y2="${r}" stroke="#2a2b2e" stroke-width="2.5"/>`;}
 else{ // icap: left clear packed with pellets, right cream Zn
  s+=`<path d="M0,${-r} H${-L/2+r} A${r},${r} 0 0 0 ${-L/2+r},${r} H0Z" fill="rgba(220,230,238,.28)" stroke="#2a2b2e" stroke-width="3"/>`;
  const pr=h*.11;for(let i=0;i<5;i++)for(let j=0;j<4;j++){const px=-L/2+r*.55+i*pr*2.15+(j%2)*pr*.9,py=-r+pr*1.5+j*pr*2.05;if(px>-pr*1.1)continue;const dx=px-(-L/2+r),dy=py;if(px<-L/2+r&&dx*dx+dy*dy>(r-pr*1.2)**2)continue;s+=`<circle cx="${px}" cy="${py}" r="${pr}" fill="#fbfaf6" stroke="#2a2b2e" stroke-width="1.6"/>`;}
  s+=`<path d="M0,${-r} H${L/2-r} A${r},${r} 0 0 1 ${L/2-r},${r} H0Z" fill="#e9dcbc" stroke="#2a2b2e" stroke-width="3"/><text x="${L/4}" y="${h*.13}" font-family="K" font-weight="800" font-size="${h*.38}" text-anchor="middle" fill="${INK}">Zn</text>`;}
 return s+'</g>';}
function ticks(x,y,R,p,c=CH,n=6,a0=-90){if(p<=0||p>=1)return '';let s='';const k=Math.sin(p*Math.PI);for(let i=0;i<n;i++){const a=(a0+i*360/n)*Math.PI/180,r1=R+p*18,r2=r1+26*k;s+=`<line x1="${x+Math.cos(a)*r1}" y1="${y+Math.sin(a)*r1}" x2="${x+Math.cos(a)*r2}" y2="${y+Math.sin(a)*r2}" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`;}return s;}
function check(x,y,s,p,c=GRN,w=12){return ch(`M${x-s*.5},${y} L${x-s*.12},${y+s*.38} L${x+s*.55},${y-s*.45}`,p,w,c);}
function cross(x,y,s,p,c=RED,w=11){return ch(`M${x-s/2},${y-s/2} L${x+s/2},${y+s/2}`,cl(p*2),w,c)+ch(`M${x+s/2},${y-s/2} L${x-s/2},${y+s/2}`,cl(p*2-1),w,c);}
function male(x,y,r,p,c=CH,w=8){const a=Math.PI/4,ex=x+Math.cos(-a)*r,ey=y+Math.sin(-a)*r,L=r*.85;
 return ch(`M${x+r},${y} A${r},${r} 0 1 1 ${x+r-.01},${y-.5}`,cl(p*1.4),w,c)+ch(`M${ex},${ey} L${ex+L*.7},${ey-L*.7}`,cl(p*3-1.6),w,c)+ch(`M${ex+L*.7-r*.5},${ey-L*.7} L${ex+L*.7},${ey-L*.7} L${ex+L*.7},${ey-L*.7+r*.5}`,cl(p*3-2),w,c);}
function paper(x,y,w,h,r,inner,o=1,s=1){if(o<=0)return '';const id=uid();return `<g transform="translate(${x},${y}) rotate(${r}) scale(${s})" opacity="${o}"><rect x="${-w/2+5}" y="${-h/2+9}" width="${w}" height="${h}" fill="rgba(0,0,0,.4)" rx="3"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="#efe8d6" rx="3"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="url(#pgrain)" rx="3" opacity=".5"/>${inner}<rect x="-42" y="${-h/2-16}" width="84" height="30" fill="rgba(226,221,196,.82)" transform="rotate(-3)"/></g>`;}
function tag(x,y,txt,r=-3,fs=34,o=1,s=1,col=INK){fs=Math.round(fs*1.3);const w=tw(txt,fs,800)+40,h=fs*1.45;return paper(x,y,w,h,r,`<text x="0" y="${fs*.36}" font-family="K" font-weight="800" font-size="${fs}" text-anchor="middle" fill="${col}">${txt}</text>`,o,s);}
function ctext(x,y,txt,fs,p,c=CH,anchor='middle',wt=800){if(p<=0)return '';const w=tw(txt,fs,wt),x0=anchor=='middle'?x-w/2:anchor=='end'?x-w:x;const id=uid();
 return `<clipPath id="${id}"><rect x="${x0-10}" y="${y-fs*1.3}" width="${(w+20)*p}" height="${fs*1.9}"/></clipPath><text clip-path="url(#${id})" x="${x0}" y="${y}" font-family="K" font-weight="${wt}" font-size="${fs}" fill="${c}" filter="url(#chf)">${txt}</text>`;}
function ctextRange(x,y,txt,fs,anchor='middle',wt=800){const w=tw(txt,fs,wt),x0=anchor=='middle'?x-w/2:anchor=='end'?x-w:x;return {d:`M${x0},${y-fs*.25} L${x0+w},${y-fs*.25}`,x0,w};}
function jar(cx,bottom,h,o=1,r=0){const w=h*434/810;return `<g opacity="${o}" transform="rotate(${r} ${cx} ${bottom})"><ellipse cx="${cx}" cy="${bottom-4}" rx="${w*.48}" ry="${h*.025}" fill="rgba(0,0,0,.45)"/><image href="inzent_zinc_icap.png" x="${cx-w/2}" y="${bottom-h}" width="${w}" height="${h}"/></g>`;}
function box(cx,bottom,h,o=1,r=0){const w=h*660/1048;return `<g opacity="${o}" transform="rotate(${r} ${cx} ${bottom})"><image href="inzent_zinc_icap_box30.png" x="${cx-w/2}" y="${bottom-h}" width="${w}" height="${h}"/></g>`;}
function body(cx,cy,s){return {head:`M${cx+45*s},${cy-160*s} A${45*s},${45*s} 0 1 1 ${cx+45*s-.01},${cy-160.5*s}`,
 torso:`M${cx-115*s},${cy+170*s} L${cx-115*s},${cy-40*s} Q${cx-115*s},${cy-95*s} ${cx-55*s},${cy-95*s} L${cx+55*s},${cy-95*s} Q${cx+115*s},${cy-95*s} ${cx+115*s},${cy-40*s} L${cx+115*s},${cy+170*s}`};}

// ---------- hands ----------
const HANDS={chalk:{src:'chalk.png',w:242,h:315,ax:2,ay:6,s:1.05,off:[480,620]},
 marker:{src:'marker.png',w:302,h:561,ax:151,ay:548,s:.78,off:[120,-760]},
 pinch:{src:'pinch2.png',w:415,h:845,ax:73,ay:760,s:.62,off:[160,-760]},
 stamp:{src:'stamp.png',w:453,h:283,ax:4,ay:178,s:.7,off:[700,60]},
 hold:{src:'hold.png',w:377,h:337,ax:6,ay:190,s:.85,off:[720,40]}};
function handImg(k,x,y,rot=0){const H=HANDS[k],s=H.s;if(x<-600||x>1700||y<-1000||y>1700)return '';
 return `<g transform="translate(${x},${y}) rotate(${rot})"><image href="${H.src}" x="${-H.ax*s}" y="${-H.ay*s}" width="${H.w*s}" height="${H.h*s}"/></g>`;}
// a hand that draws a sequence of chalk segments: segs=[{d,a,dur}] -> {p:[..], hand}
function drawSeq(t,k,segs,{enter=.3,exit=.4,wob=1}={}){const H=HANDS[k];const ps=segs.map(s=>P(t,s.a,s.dur));let tip;
 const first=segs[0],last=segs[segs.length-1];
 if(t<first.a){const q=ptAt(first.d,0),e=eo(P(t,first.a-enter,enter));tip={x:q.x+H.off[0]*(1-e),y:q.y+H.off[1]*(1-e)};}
 else if(t>=last.a+last.dur){const q=ptAt(last.d,1),e=eio(P(t,last.a+last.dur,exit));tip={x:q.x+H.off[0]*e,y:q.y+H.off[1]*e};}
 else{for(let i=0;i<segs.length;i++){const s=segs[i];if(t>=s.a&&t<s.a+s.dur){tip=ptAt(s.d,P(t,s.a,s.dur));break;}
   const n=segs[i+1];if(n&&t>=s.a+s.dur&&t<n.a){const A=ptAt(s.d,1),B=ptAt(n.d,0),e=eio(P(t,s.a+s.dur,n.a-s.a-s.dur));tip={x:lerp(A.x,B.x,e),y:lerp(A.y,B.y,e)-Math.sin(e*Math.PI)*30};break;}}}
 const rot=Math.sin(t*23)*1.2*wob;return {p:ps,hand:handImg(k,tip.x,tip.y,rot)};}
// a hand that brings/places something at (x,y) by time a+dur, holds for hold s, leaves. returns {hand, held(0..1 arrival), placed}
function placeHand(t,k,x,y,a,dur=.45,hold=.25,exit=.4){const H=HANDS[k];let px=x,py=y;
 if(t<a+dur){const e=eo(P(t,a,dur));px=x+H.off[0]*(1-e);py=y+H.off[1]*(1-e);}
 else if(t>a+dur+hold){const e=eio(P(t,a+dur+hold,exit));px=x+H.off[0]*e;py=y+H.off[1]*e;}
 return {hand:(t<a-0.01||t>a+dur+hold+exit)?'':handImg(k,px,py),dx:px-x,dy:py-y,carry:t<a+dur+hold,arrived:t>=a+dur};}

// ---------- captions ----------
const CAPS=[
 [0,'ฮอร์โมนเพศชาย ต้องใช้<span class="y">ซิงค์</span>'],
 [2.3,'กินเลย <span class="y">วันละ 15 มก.</span>'],
 [4.2,'ช่วยสร้าง<span class="y">กล้ามเนื้อ</span>'],
 [6.45,'<span class="y">สิว</span>บนใบหน้า'],
 [7.7,'ทั้ง<span class="y">ทางกาย</span> และ<span class="y">ทางเพศ</span>'],
 [9.3,'ความยืดหยุ่นของ<span class="y">กระดูก</span>'],
 [10.5,'เรื่อง<span class="y">อารมณ์</span>ก็เกี่ยวด้วย'],
 [12.95,'หงุดหงิด · กระตือรือร้น · <span class="y">สมาธิ</span>'],
 [15.25,'ถ้า<span class="rb">ซิงค์ไม่พอ</span>'],
 [16.4,'สร้างฮอร์โมน<span class="y">ยากขึ้น</span>'],
 [17.95,'ทุกอย่าง<span class="y">รวนไปหมด</span>'],
 [19.38,'<span class="rb">สมดุลเสีย!</span>'],
 [20.15,'ผู้ชายควรได้<span class="y">ซิงค์วันละ 15 มก.</span>'],
 [23.3,'เช่น<span class="y">ตัวนี้</span> ซิงค์บิสไกลซิเนต iCAP'],
 [25.2,'ให้ซิงค์ <span class="y">15 มก. พอดี</span>'],
 [27.0,'นวัตกรรม <span class="y">iCAP</span>'],
 [27.8,'<span class="y">ดูดซึมดีกว่า</span>บิสไกลซิเนตทั่วไป'],
 [29.85,'กักเก็บซิงค์ได้<span class="y">นานถึง 6 ชม.</span>'],
 [32.75,'หาซิงค์ช่วยเรื่อง<span class="y">ฮอร์โมน</span>?'],
 [34.7,'ตัวนี้<span class="y">ตอบโจทย์</span>เลย'],
 [35.7,'อยู่ในร่างกาย<span class="y">นานกว่า</span>ซิงค์ทั่วไป'],
 [37.8,'ดูดซึมได้<span class="y">เยอะ</span>'],
 [39.3,'<span class="rb">พิกัดซ้ายล่าง</span>'],
];
const capEl=document.getElementById('cap');let capIdx=-1;
function setCap(t){let i=0;for(let k=0;k<CAPS.length;k++)if(t>=CAPS[k][0])i=k;
 if(i!==capIdx){capEl.innerHTML=CAPS[i][1];capIdx=i;}
 const lt=t-CAPS[i][0];const s=i==0?1:lerp(.86,1,eb(P(lt,0,.28)));const o=i==0?1:cl(lt/.08);
 capEl.style.transform=`scale(${s})`;capEl.style.opacity=o;}

// ---------- scenes ----------
const S=[];const sc=(s,e,f)=>S.push({s,e,f});
const CX=540;

// 1. hormone needs zinc  (frame 0 readable): man -> testosterone molecule, zinc goes in
function polyFrom(P1,P2,n){const pts=[P1,P2];let ang=Math.atan2(P2.y-P1.y,P2.x-P1.x);const a=Math.hypot(P2.x-P1.x,P2.y-P1.y);let c=P2;for(let i=0;i<n-2;i++){ang+=2*Math.PI/n;c={x:c.x+Math.cos(ang)*a,y:c.y+Math.sin(ang)*a};pts.push(c);}return pts;}
function hexAt(cx,cy,a){const p=[];for(let i=0;i<6;i++){const t=(-90+60*i)*Math.PI/180;p.push({x:cx+a*Math.cos(t),y:cy+a*Math.sin(t)});}return p;}
const pd=pts=>'M'+pts.map(q=>q.x.toFixed(1)+','+q.y.toFixed(1)).join(' L')+' Z';
function testo(cx,cy,a){const r3=Math.sqrt(3);const A=hexAt(cx,cy,a),B=hexAt(cx+a*r3,cy,a),C=hexAt(cx+a*r3*1.5,cy-a*1.5,a);
 const D=polyFrom(C[2],C[1],5); // pentagon on C's right edge
 const top=D[3]||D[2];
 return {rings:[pd(A),pd(B),pd(C),pd(D)],A,B,C,D};}
sc(0,2.3,t=>{let o='';const pl=placeHand(t,'pinch',150,340,-0.5,.5,.35);
 {const k=.7,ox=370-540*k,oy=560-440*k;let m=ch(TL,1,8/k)+ch(TR,1,8/k)+ch(pec(0,-1),1,8/k)+ch(pec(0,1),1,8/k)+ch('M540,300 L540,680',1,5/k);
  [[440,66],[518,66],[596,70]].forEach(([y,h])=>[[456,76],[548,76]].forEach(([x,w])=>{m+=ch(abBox(x,y,w,h),1,7/k);}));
  m+=ch('M598,125 A58,58 0 1 1 597.9,124.5',1,8/k);
  o+=`<g transform="translate(${ox},${oy}) scale(${k})">${m}</g>`;}
 o+=male(575,300,30,1,YEL,6);
 // molecule
 const M=testo(735,400,40);M.rings.forEach(d=>o+=ch(d,1,6));
 const D=M.D;
 const tp=D[3];o+=ch(`M${tp.x},${tp.y} L${tp.x+28},${tp.y-34}`,1,6)+`<text x="${tp.x+22}" y="${tp.y-42}" font-family="K" font-weight="800" font-size="32" fill="${CH}">OH</text>`;
 o+=tag(790,560,'ฮอร์โมนเพศชาย',-3,32);
 o+=`<text x="790" y="635" font-family="K" font-weight="600" font-size="30" text-anchor="middle" fill="${CH}" opacity=".85">(เทสโทสเตอโรน)</text>`;
 // man produces hormone
 o+=ch('M530,470 Q565,440 598,440',1,7)+ch('M570,420 L600,440 L572,462',1,7);
 // zinc goes into the man
 o+=ch('M175,400 Q205,470 250,510',P(t,.5,.4),7,YEL)+ch('M222,510 L252,512 L248,482',P(t,.85,.12),7,YEL);
 o+=coin(150+(pl.arrived?0:pl.dx),340+(pl.arrived?0:pl.dy),58,'Zn','#efe9da',INK,44);
 o+=tag(150,250,'ซิงค์',3,30,P(t,.4,.2),pop(t,.4));
 const gl=P(t,1.75,.5);if(gl>0)o+=`<circle cx="760" cy="350" r="${165+gl*10}" fill="none" stroke="${YEL}" stroke-width="7" opacity="${Math.sin(gl*Math.PI)*.8}"/>`;
 o+=ticks(575,300,45,P(t,1.6,.5),YEL,6);
 return {o,h:pl.hand};});
// 2. take 15 mg a day
sc(2.3,4.2,t=>{let o='';const lt=t-2.3;
 const b=pop(t,2.35,.4);o+=capsule(400,380,230,-28,'plain',cl(b*2));o+=ticks(400,380,140,P(t,2.5,.5));
 const R=ctextRange(720,420,'15 mg',110,'middle',900);const hs=drawSeq(t,'chalk',[{d:R.d,a:3.45,dur:.55}]);
 o+=ctext(720,420,'15 mg',110,hs.p[0],CH,'middle',900);
 o+=tag(720,500,'ต่อวัน',-4,36,P(t,3.95,.15),pop(t,3.95));
 return {o,h:hs.hand};});
// 3. muscle
const TL='M540,190 L470,190 L460,235 Q340,242 300,285 Q282,335 318,405 Q352,485 378,560 L388,690';
const TR='M540,190 L610,190 L620,235 Q740,242 780,285 Q798,335 762,405 Q728,485 702,560 L692,690';
function pec(k,side){const m=x=>side<0?x:1080-x;return `M540,300 Q${m(450)},${282-k*.3} ${m(350)},${305-k*.2} Q${m(318-k*.4)},${395+k*.5} ${m(400)},${410+k*.6} Q${m(480)},${428+k} 540,${388+k*.4}`;}
