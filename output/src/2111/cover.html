<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<style>
@font-face{font-family:K;font-weight:600;src:url(kanit-latin-600-normal.woff2)}
@font-face{font-family:K;font-weight:800;src:url(kanit-latin-800-normal.woff2)}
@font-face{font-family:K;font-weight:900;src:url(kanit-latin-900-normal.woff2)}
@font-face{font-family:K;font-weight:600;src:url(kanit-thai-600-normal.woff2);unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:K;font-weight:800;src:url(kanit-thai-800-normal.woff2);unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:K;font-weight:900;src:url(kanit-thai-900-normal.woff2);unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1440px;height:1080px;overflow:hidden;background:#000}
body{font-family:K,sans-serif;color:#fff}
#stage{position:relative;width:1440px;height:1080px;overflow:hidden;background:#0E0F12}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.sbg{position:absolute;inset:-60px}
.studio{background:radial-gradient(circle at 50% 42%,#4A4E57 0%,#22252B 45%,#0B0C0F 100%)}
.split{background:linear-gradient(90deg,#0F2A63 0%,#163A7A 46%,#1B1D22 54%,#0B0C0F 100%)}
.lab{background:radial-gradient(circle at 50% 42%,#FFFFFF 0%,#EEF1F6 50%,#C9D0DC 100%)}
.champ{background:radial-gradient(circle at 50% 30%,#FFFDF7 0%,#F6EAD2 50%,#D8BE8E 100%)}
.light{background:radial-gradient(circle at 50% 40%,#FFFFFF 0%,#E7E9EE 55%,#B9BEC8 100%)}
.cam{position:absolute;inset:0;will-change:transform}
.a{position:absolute;opacity:0;will-change:transform}
.img{background-position:center;background-size:contain;background-repeat:no-repeat;filter:drop-shadow(0 28px 34px rgba(0,0,0,.55))}
.nb{background-image:url(new_bottle.png)}.ob{background-image:url(old_bottle.png)}.bx{background-image:url(new_box.png)}
.img.bx{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.85)) drop-shadow(0 28px 34px rgba(0,0,0,.55))}.pel{background-image:url(pellet.png)}
.shine{position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0) 0 42%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 58% 100%) no-repeat;background-size:300% 100%}
.nb .shine{-webkit-mask:url(new_bottle.png) center/contain no-repeat}.ob .shine{-webkit-mask:url(old_bottle.png) center/contain no-repeat}.bx .shine{-webkit-mask:url(new_box.png) center/contain no-repeat}
.rays{position:absolute;border-radius:50%;background:repeating-conic-gradient(rgba(255,226,170,.28) 0 7deg,rgba(255,255,255,0) 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%)}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,236,200,.75),rgba(217,185,138,.35) 38%,rgba(217,185,138,0) 70%)}
.glowB{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(120,170,255,.55),rgba(46,196,182,.2) 40%,rgba(0,0,0,0) 70%)}
.card{position:absolute;border-radius:40px;overflow:hidden}
.card.old{background:linear-gradient(160deg,#2A5BC0,#123478 70%);border:6px solid #4F86F0;box-shadow:0 24px 50px rgba(0,0,0,.45)}
.card.new{background:linear-gradient(160deg,#3A3D44,#121317 70%);border:6px solid #D9B98A;box-shadow:0 24px 50px rgba(0,0,0,.55),0 0 60px rgba(217,185,138,.25)}
.big{font-weight:900;white-space:nowrap;line-height:1.15;text-align:center}
.cx{left:170px;width:1100px}
.gold{color:#F3D9A4;text-shadow:0 6px 0 #7A5B2E,0 14px 30px rgba(0,0,0,.6)}
.wht{color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.55),0 14px 30px rgba(0,0,0,.5)}
.pill{display:inline-block;padding:10px 40px 16px;border-radius:999px;font-weight:900;white-space:nowrap;line-height:1.2}
.p-gold{background:linear-gradient(90deg,#F6E2B5,#D2A867);color:#16171B;box-shadow:0 9px 0 #8A6731,0 18px 30px rgba(0,0,0,.45)}
.p-blue{background:#2EC4B6;color:#0B2240;box-shadow:0 9px 0 #12756C,0 18px 30px rgba(0,0,0,.4)}
.p-dark{background:#16171B;color:#F3D9A4;border:4px solid #D9B98A;box-shadow:0 9px 0 #000,0 18px 30px rgba(0,0,0,.5)}
.p-red{background:#E5484D;color:#fff;box-shadow:0 9px 0 #8E1A1D,0 18px 30px rgba(0,0,0,.4)}
.p-white{background:#fff;color:#16171B;box-shadow:0 9px 0 #9AA0AC,0 18px 30px rgba(0,0,0,.4)}
.hl{background:linear-gradient(transparent 60%,rgba(217,185,138,.75) 60%,rgba(217,185,138,.75) 92%,transparent 92%) no-repeat;background-size:0% 100%;padding:0 8px}
.bar{position:absolute;height:84px;border-radius:42px;background:rgba(255,255,255,.12);border:4px solid rgba(255,255,255,.25);overflow:hidden}
.bar .fl{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:42px}
.tick{position:absolute;font-weight:800;font-size:32px;color:rgba(255,255,255,.7);transform:translateX(-50%)}
.dust{position:absolute;border-radius:50%;background:#fff}
.ring{position:absolute;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;border:16px solid #F3D9A4;opacity:0}
.conf{position:absolute;width:20px;height:32px;border-radius:5px}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#wipe{position:absolute;top:-200px;width:2600px;height:1500px;transform:translateX(-3200px) skewX(-16deg)}
#wipe div{position:absolute;top:0;bottom:0}
.photo{position:absolute;border-radius:36px;overflow:hidden;border:8px solid #fff;box-shadow:0 26px 60px rgba(0,0,0,.55)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.capsvg{position:absolute;width:260px;height:600px;transform-origin:50% 50%}
.capsvg svg{width:100%;height:100%;display:block;overflow:visible}
.chk{position:absolute;width:120px;height:120px}
.cu{position:absolute}
.cal{position:absolute}
.capbig{position:absolute;width:260px;height:600px;transform-origin:50% 50%}
.capbig svg{width:100%;height:100%;display:block;overflow:visible}
.b30{background-image:url(box30.png)}.b60{background-image:url(box60.png)}
.cop{color:#F0A070}
</style></head><body>
<div id="stage" style="background:radial-gradient(circle at 50% 42%,#4A4E57 0%,#22252B 45%,#0B0C0F 100%)">
<div class="rays" style="position:absolute;left:760px;top:60px;width:640px;height:640px;opacity:1"></div>
<svg style="position:absolute;left:0;top:0;width:1440px;height:1080px" viewBox="0 0 1440 1080">
<defs><radialGradient id="zz" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#C9CED8"/><stop offset="1" stop-color="#7C838F"/></radialGradient>
<radialGradient id="cc" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#FFE0C8"/><stop offset=".55" stop-color="#E08A55"/><stop offset="1" stop-color="#8E4A22"/></radialGradient>
<radialGradient id="gw"><stop offset="0" stop-color="#FFECC8" stop-opacity=".6"/><stop offset="1" stop-color="#D9B98A" stop-opacity="0"/></radialGradient></defs>
<circle cx="1080" cy="340" r="320" fill="url(#gw)"/>
<image href="jar.png" x="945" y="60" width="270" height="504"/>
<g transform="translate(870 760)"><circle r="110" fill="url(#zz)" stroke="#5B616B" stroke-width="7"/><text y="36" text-anchor="middle" font-family="Arial" font-weight="700" font-size="100" fill="#3A3F47">Zn</text></g>
<g transform="translate(1290 760)"><circle r="110" fill="url(#cc)" stroke="#6B3418" stroke-width="7"/><text y="36" text-anchor="middle" font-family="Arial" font-weight="700" font-size="100" fill="#4A230E">Cu</text></g>
<path d="M985 760 H1175" stroke="#FF3B3F" stroke-width="16" stroke-dasharray="26 16" stroke-linecap="round"/>
<g transform="translate(1080 760)"><circle r="62" fill="#E5484D" stroke="#fff" stroke-width="8"/><text y="30" text-anchor="middle" font-family="K" font-weight="900" font-size="90" fill="#fff">?</text></g>
</svg>
<div style="position:absolute;left:80px;top:150px;width:760px">
 <div class="big" style="text-align:left;font-size:96px;color:#fff;text-shadow:0 8px 0 rgba(0,0,0,.6)">กินซิงค์นานๆ</div>
 <div class="big" style="text-align:left;font-size:112px;line-height:1.25"><span class="cop" style="text-shadow:0 8px 0 #6B3418">ทองแดง</span><span style="color:#fff;text-shadow:0 8px 0 rgba(0,0,0,.6)">ต่ำ</span></div>
 <div class="big" style="text-align:left;font-size:120px;color:#F3D9A4;text-shadow:0 8px 0 #7A5B2E">จริงไหม?</div>
 <div style="margin-top:40px"><span class="pill p-red" style="font-size:52px">เกิน 40 mg อันตราย!</span></div><div style="margin-top:34px"><span class="pill p-gold" style="font-size:52px">1 เม็ด 15 mg ปลอดภัย</span></div>
</div>

</div>
<script>window.render=function(){}</script></body></html>
