 <div class="a" data-at="10.95" data-an="pop" data-bob="0" style="left:820px;top:720px"><svg width="96" height="96" viewBox="0 0 100 100"><use href="#orb"/></svg></div>
 <div class="a" data-at="11.05" data-an="pop" data-bob="2" style="left:590px;top:735px"><svg width="70" height="70" viewBox="0 0 100 100"><use href="#orb"/></svg></div>
</div>

<div id="rings"></div>
<div id="swipe"><div class="b2"></div><div class="b1"></div><div class="b3"></div></div>
<div id="flash"></div>
<div id="safe" style="display:none;position:absolute;left:130px;top:130px;width:820px;height:820px;border:3px dashed #f0f;pointer-events:none"></div>
<svg width="0" height="0" style="position:absolute"><defs>
 <radialGradient id="gRd" cx=".38" cy=".34" r=".7"><stop offset="0" stop-color="#FFC2CE"/><stop offset=".45" stop-color="#F0475F"/><stop offset="1" stop-color="#9E0F2A"/></radialGradient>
 <radialGradient id="gOr" cx=".38" cy=".34" r=".7"><stop offset="0" stop-color="#FFE2A8"/><stop offset=".45" stop-color="#F5A524"/><stop offset="1" stop-color="#B36B00"/></radialGradient>
 <symbol id="st" viewBox="0 0 100 100"><path d="M50 0C54 36 64 46 100 50 64 54 54 64 50 100 46 64 36 54 0 50 36 46 46 36 50 0z" fill="#fff"/></symbol>
 <symbol id="orb" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="url(#gRd)" stroke="#fff" stroke-width="4"/><ellipse cx="35" cy="32" rx="14" ry="9" fill="#fff" opacity=".8"/></symbol>
 <symbol id="bolt" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#F2D58A" stroke="#fff" stroke-width="6"/><path d="M56 12L28 56h20l-6 32 30-46H52z" fill="#E5484D" stroke="#9E0F2A" stroke-width="3" stroke-linejoin="round"/></symbol>
 <symbol id="capsule" viewBox="0 0 120 50"><path d="M25 3h35v44H25a22 22 0 010-44z" fill="#E5484D"/><path d="M60 3h35a22 22 0 010 44H60z" fill="#FFF"/><rect x="2" y="3" width="116" height="44" rx="22" fill="none" stroke="#9E0F2A" stroke-width="4"/><ellipse cx="38" cy="15" rx="12" ry="5" fill="#fff" opacity=".7"/></symbol>
 <symbol id="gear" viewBox="-50 -50 100 100"><path d="M-7-48h14l3 11 9 4 10-6 10 10-6 10 4 9 11 3v14l-11 3-4 9 6 10-10 10-10-6-9 4-3 11H-7l-3-11-9-4-10 6-10-10 6-10-4-9-11-3V-7l11-3 4-9-6-10 10-10 10 6 9-4z"/><circle r="14" fill="#22337E"/></symbol>
</defs></svg>
</div>

<script>
const W=1080,H=1080,DURATION=11.53;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOC=p=>1-Math.pow(1-p,3);
const eOB=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const eIO=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
if(location.hash==='#safe')document.getElementById('safe').style.display='block';
function face(e,hy){let s='';const ey=hy+2;
 if(e==='awake')s+=`<circle cx="-19" cy="${ey}" r="11" fill="#fff"/><circle cx="19" cy="${ey}" r="11" fill="#fff"/><circle cx="-17" cy="${ey}" r="6" fill="#2B1B12"/><circle cx="21" cy="${ey}" r="6" fill="#2B1B12"/><path d="M-10 ${hy+30} h20" stroke="#7A2E1A" stroke-width="5" stroke-linecap="round"/>`;
 else s+=`<circle cx="-19" cy="${ey}" r="7" fill="#2B1B12"/><circle cx="19" cy="${ey}" r="7" fill="#2B1B12"/>`;
 if(e==='smile'||e==='happy')s+=`<path d="M-16 ${hy+22} Q0 ${hy+(e==='happy'?44:36)} 16 ${hy+22}" stroke="#7A2E1A" stroke-width="6" fill="${e==='happy'?'#7A2E1A':'none'}" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-33" cy="${hy+18}" r="8" fill="#F59E8B" opacity=".7"/><circle cx="33" cy="${hy+18}" r="8" fill="#F59E8B" opacity=".7"/>`;
 return s}
function hairPath(st,hy,hr){return `<path d="M-54 ${hy-4} C-58 ${hy-74} 58 ${hy-74} 54 ${hy-4} C40 ${hy-32} -10 ${hy-42} -54 ${hy-4}z" fill="${hr}"/>`}
function headSvg(o){const sk=o.skin||'#F5C9A0',hr=o.hair||'#2B1B12';let s=`<circle cx="-50" cy="4" r="12" fill="${sk}"/><circle cx="50" cy="4" r="12" fill="${sk}"/><circle cx="0" cy="0" r="52" fill="${sk}"/>`+hairPath(o.hairStyle,0,hr);
 (o.faces||[{e:o.expr||'smile'}]).forEach(f=>{s+=`<g ${f.vis?`data-vis="${f.vis}"`:''}>${face(f.e,0)}</g>`});return s}
function person(o){const sk=o.skin||'#F5C9A0',sh=o.shirt||'#3B82F6',pa=o.pants||'#334155';
 const sit=o.pose==='sit';const legTop=sit?-95:-120,bodyTop=sit?-215:-235,bodyBot=sit?-90:-110,hy=bodyTop-50;let s='';
 s+=`<path d="M-24 ${legTop} V-12 M24 ${legTop} V-12" stroke="${pa}" stroke-width="34" stroke-linecap="round"/><ellipse cx="-28" cy="-6" rx="24" ry="11" fill="#222"/><ellipse cx="28" cy="-6" rx="24" ry="11" fill="#222"/>`;
 s+=`<rect x="-14" y="${hy+30}" width="28" height="34" fill="${sk}"/><rect x="-54" y="${bodyTop}" width="108" height="${bodyBot-bodyTop+20}" rx="44" fill="${sh}"/>`;
 const arm=(sd,k)=>{const sx=sd*46,sy=bodyTop+28;let ex,ey;
  if(k==='fwd'){ex=sd*150;ey=bodyTop+70}else if(k==='up'){ex=sd*95;ey=bodyTop-75}else if(k==='hold'){ex=sd*55;ey=bodyTop+60}else{ex=sd*66;ey=bodyTop+120}
  return `<path d="M${sx} ${sy} L${ex} ${ey}" stroke="${sh}" stroke-width="30" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="16" fill="${sk}"/>`};
 s+=arm(-1,o.armL||'down')+arm(1,o.armR||'down');
 s+=`<g transform="translate(0 ${hy})">${headSvg(o)}</g>`;return s}
document.querySelectorAll('[data-person]').forEach(g=>g.innerHTML=person(JSON.parse(g.dataset.person)));
document.querySelectorAll('[data-head]').forEach(g=>g.innerHTML=headSvg(JSON.parse(g.dataset.head)));
document.querySelectorAll('.bottle').forEach((b,i)=>{const s=document.createElement('div');s.className='shine';s.dataset.ph=i*0.41;b.appendChild(s)});
// S4 diving orbs
const NS='http://www.w3.org/2000/svg';const orbs4=[];
[[300,330,5.9],[430,420,6.0],[540,300,6.08],[360,560,6.16],[220,420,6.24],[520,470,6.3],[420,250,6.36]].forEach(([x,y,at])=>{
 const g=document.createElementNS(NS,'g');const tr=document.createElementNS(NS,'path');tr.setAttribute('stroke','rgba(240,71,95,.35)');tr.setAttribute('stroke-width','16');tr.setAttribute('stroke-linecap','round');tr.setAttribute('fill','none');
 const u=document.createElementNS(NS,'use');u.setAttribute('href','#orb');u.setAttribute('width','64');u.setAttribute('height','64');u.setAttribute('x','-32');u.setAttribute('y','-32');
 g.appendChild(tr);g.appendChild(u);document.getElementById('orbs4').appendChild(g);orbs4.push({g,tr,u,x,y,at})});
// scenes
const scenes=[...document.querySelectorAll('.scene')].map((el,i)=>{
 const bg=document.createElement('div');bg.className='sbg '+el.dataset.bg;el.insertBefore(bg,el.firstChild);
 const parts=[];const pl=document.createElement('div');pl.style.cssText='position:absolute;inset:0;pointer-events:none';el.insertBefore(pl,bg.nextSibling);
 if(el.dataset.p==='stars'){for(let k=0;k<46;k++){const d=document.createElement('div');d.className='starp';const s=2+rnd()*4;d.style.width=d.style.height=s+'px';d.style.left=(170+rnd()*740)+'px';d.style.top=(170+rnd()*740)+'px';pl.appendChild(d);parts.push({d,tw:rnd()*6,sp:1+rnd()*2,star:1})}}
 else{for(let k=0;k<14;k++){const d=document.createElement('div');d.className='bub';const s=16+rnd()*60;d.style.width=d.style.height=s+'px';pl.appendChild(d);parts.push({d,x:170+rnd()*680,y:rnd()*H,v:20+rnd()*40,ph:rnd()*6.28})}}
 return{el,s:+el.dataset.s,e:+el.dataset.e,tr:el.dataset.tr||'',parts,items:[...el.querySelectorAll('.a')]}});
const TR=0.42;
const conf=[];const cw=document.getElementById('confetti');const cc=['#F2D58A','#E5484D','#fff','#FFB3C3','#2F55D4'];
for(let i=0;i<60;i++){const d=document.createElement('div');d.className='conf';d.style.background=cc[i%5];cw.appendChild(d);
 conf.push({d,x:190+rnd()*700,vy:260+rnd()*320,vx:(rnd()-.5)*140,r:rnd()*360,vr:(rnd()-.5)*720,dl:rnd()*0.5,sw:rnd()*6});}
const ringDefs=[[0.62,540,470],[1.66,730,255],[6.8,540,560],[8.95,720,550],[9.62,540,460],[10.75,750,470]];
const rw=document.getElementById('rings');const rings=ringDefs.map(([t,x,y])=>{const d=document.createElement('div');d.className='ring';d.style.left=x+'px';d.style.top=y+'px';rw.appendChild(d);return{d,t}});
function animT(an,p){switch(an){
 case 'fade':return [eOC(p),''];
 case 'pop':{const s=p<=0?0:eOB(p);return [cl(p*4),`scale(${s})`]}
 case 'slam':{const e=eOC(p);return [cl(p*5),`scale(${1+1.2*(1-e)})`]}
 case 'stamp':{const e=eOB(p);return [cl(p*5),`scale(${1.6-0.6*e}) rotate(${-6*(1-e)}deg)`]}
 case 'up':{const e=eOB(p);return [cl(p*3),`translateY(${80*(1-e)}px)`]}
 case 'left':{const e=eOB(p);return [cl(p*3),`translateX(${-280*(1-e)}px)`]}
 case 'right':{const e=eOB(p);return [cl(p*3),`translateX(${280*(1-e)}px)`]}
 case 'drop':{const e=eOB(p);return [cl(p*4),`translateY(${-650*(1-e)}px) rotate(${(1-e)*-25}deg)`]}}return [1,'']}
const DUR={fade:.35,pop:.42,slam:.32,stamp:.35,up:.42,left:.45,right:.45,drop:.55};
const $=id=>document.getElementById(id);
window.render=function(t){
 let flash=0;
 scenes.forEach((sc,i)=>{
  const nx=scenes[i+1];const tail=(nx&&nx.tr&&nx.tr!=='swipe'&&nx.tr!=='flash')?TR:0;
  const on=t>=sc.s&&t<sc.e+tail; sc.el.style.display=on?'block':'none'; if(!on)return;
  const lt=t-sc.s, len=Math.min(sc.e,DURATION)-sc.s, q=cl(lt/TR);
  let tf=`scale(${1+0.02*cl(lt/len)})`, clip='none', op=1;
  if(sc.tr==='iris'){clip=`circle(${eIO(q)*110}% at 50% 48%)`}
  else if(sc.tr==='slideleft'){tf=`translateX(${(1-eOC(q))*1080}px) `+tf}
  else if(sc.tr==='zoom'){tf=`scale(${1.35-0.35*eOC(q)}) `+tf;op=q}
  else {tf=`scale(${1.07-0.07*eOC(cl(lt/0.3))}) `+tf}
  sc.el.style.transform=tf;sc.el.style.clipPath=q<1?clip:'none';sc.el.style.opacity=op;
  for(const p of sc.parts){
   if(p.star){p.d.style.opacity=.35+.65*Math.abs(Math.sin(t*p.sp+p.tw))}
   else{const y=((p.y-p.v*t)%(H+200)+H+200)%(H+200)-100;const x=p.x+Math.sin(t*0.8+p.ph)*28;
    p.d.style.transform=`translate(${x}px,${y}px)`;p.d.style.opacity=.8*cl((y-150)/90)*cl((900-y)/90)}}
  for(const el of sc.items){
   const at=+el.dataset.at, an=el.dataset.an, p=cl((t-at)/DUR[an]);
   let [o,tr]=t<at?[0,'']:animT(an,p); const live=t-at;
   if(el.dataset.float){const ph=+el.dataset.float;tr+=` translateY(${Math.sin(t*2.2+ph)*12}px) perspective(1400px) rotateY(${Math.sin(t*1.4+ph)*10}deg) rotate(${Math.sin(t*1.1+ph)*2}deg)`}
   if(el.dataset.bob){const ph=+el.dataset.bob;tr+=` translateY(${Math.sin(t*3+ph)*9}px) rotate(${Math.sin(t*2.4+ph)*2.5}deg)`}
   if(el.dataset.breathe&&live>0.4){tr+=` scale(${1+0.03*Math.sin((live-0.4)*5)})`}
   if(el.dataset.spin)tr+=` rotate(${t*el.dataset.spin}deg)`;
   if(el.dataset.shake){const d=t-10.08;if(d>0&&d<0.5)tr+=` translateX(${Math.sin(d*70)*12*(1-d/0.5)}px)`}
   el.style.opacity=o; el.style.transform=tr;
  }
 });
 const sw=$('swipe');let sx=-3000;
 for(const sc of scenes){if(sc.tr==='swipe'){const d=t-sc.s;if(d>-0.2&&d<0.2){sx=-2700+eIO((d+0.2)/0.4)*4200}}
  if(sc.tr==='flash'){const d=t-sc.s;if(d>=0&&d<0.3)flash=Math.max(flash,0.9*(1-d/0.3))}}
 sw.style.transform=`translateX(${sx}px) skewX(-18deg)`; $('flash').style.opacity=flash;
 document.querySelectorAll('[data-kbi]').forEach(g=>{const d=Math.max(0,t-+g.dataset.kbi);g.style.transform=`scale(${1.03+0.025*d})`});
 document.querySelectorAll('[data-vis]').forEach(g=>{const[a,b]=g.dataset.vis.split(',').map(Number);g.style.opacity=(t>=a&&t<b)?1:0});
 document.querySelectorAll('[data-pop]').forEach(g=>{const p=cl((t-+g.dataset.pop)/0.4);g.style.opacity=cl(p*4);g.style.transform=`scale(${p?eOB(p):0})`});
 document.querySelectorAll('[data-kb]').forEach(g=>{const d=Math.max(0,t-+g.dataset.kb);g.style.transform=`scale(${1+0.012*d})`});
 document.querySelectorAll('.shine').forEach(s=>{const c=((t*0.55+ +s.dataset.ph)%1.6);s.style.backgroundPosition=`${110-c/1.6*130}% 0`});
 // S2 conveyor + machine
 if(t>=2.3&&t<4.7){
  $('belt2').setAttribute('transform',`translate(${-((t*60)%100)} 0)`);
  const x=t<2.95?80+205*eIO(cl((t-2.4)/0.55)):(t<3.6?285+220*cl((t-2.95)/0.65):505+175*eOC(cl((t-3.6)/0.5))); $('orb2').setAttribute('transform',`translate(${x} ${425+Math.sin(t*14)*3})`);
  const inside=x>285&&x<505; $('orb2').style.opacity=inside?0:1;
  const c=$('orb2').firstChild; c.setAttribute('fill',x>=505?'url(#gRd)':'url(#gOr)');
  $('gear2a').setAttribute('transform',`rotate(${t*140})`);$('gear2b').setAttribute('transform',`rotate(${-t*190})`);
  $('puff2').setAttribute('transform',`translate(${Math.sin(t*3)*6} ${-((t*30)%20)})`);$('puff2').style.opacity=.6+.4*Math.sin(t*6);
  $('lamp2').setAttribute('fill',Math.sin(t*14)>0?'#7DF9C8':'#E5484D');
  $('clkM2').setAttribute('transform',`rotate(${(t-2.3)*520})`);$('clkH2').setAttribute('transform',`rotate(${(t-2.3)*43})`);
  [...$('dots2').children].forEach((d,k)=>d.setAttribute('opacity',.3+.7*Math.max(0,Math.sin(t*7-k*0.9))));
 }
 // S3 capsule to mouth
 if(t>=4.2&&t<5.9){
  const p=eIO(cl((t-4.45)/0.5));const x=600+(380-600)*p, y=560+(355-560)*p;
  $('cap3').setAttribute('transform',`translate(${x} ${y}) rotate(${-25+25*p}) scale(${1-0.55*cl((t-4.85)/0.12)})`);$('cap3').style.opacity=t<4.97?1:0;
  $('hand3').setAttribute('transform',`translate(${640+(420-640)*p} ${620+(415-620)*p})`);$('hand3').style.opacity=1-cl((t-5.0)/0.2);
 }
 // S4 orbs dive into the cell; mitochondria power up
 if(t>=5.5&&t<7.9){
  for(const o of orbs4){const p=cl((t-o.at)/0.45),e=eOC(p);const y0=-40,y=y0+(o.y-y0)*e;
   o.g.style.opacity=t<o.at?0:1;o.u.setAttribute('transform',`translate(${o.x} ${y+(p>=1?Math.sin(t*5+o.x)*5:0)})`);
   o.tr.setAttribute('d',`M${o.x} ${Math.max(y0,y-160*(1-p))} L${o.x} ${y}`);o.tr.style.opacity=1-p}
  const k=cl((t-6.72)/0.3);['mt1','mt2','mt3'].forEach((id,j)=>{const g=$(id),el=g.firstChild;el.setAttribute('fill',k>0?`rgb(${242+13*k},${140+70*k},${91-20*k})`:'#F28C5B');
   g.style.filter=k>0?`drop-shadow(0 0 ${8+10*Math.abs(Math.sin(t*9+j))}px rgba(255,210,94,${.9*k}))`:'none'})}
 // S5 jump + battery
 if(t>=7.44&&t<9.9){
  $('jump5').setAttribute('transform',`translate(0 ${-Math.abs(Math.sin((t-7.44)*4.4))*26})`);
  const b=eOC(cl((t-8.3)/0.6));$('bat5').setAttribute('height',200*b);$('bat5').setAttribute('y',100-200*b);$('bat5').setAttribute('fill',b>.98?'#22C55E':'#E5484D');
  const op=eIO(cl((t-7.6)/0.7));$('orb5').setAttribute('transform',`translate(${150+(270-150)*op} ${120+(300-120)*op}) scale(${1-0.7*cl((t-8.2)/0.15)})`);$('orb5').style.opacity=t<8.35?1:0;
 }
 // S6 hourglass sand
 if(t>=9.45&&t<11){const p=cl((t-9.45)/1.1);$('sandT6').setAttribute('transform',`translate(150 80) scale(1 ${1-0.6*p}) translate(-150 -80)`);
  $('sandB6').setAttribute('transform',`translate(150 420) scale(1 ${0.4+0.6*p}) translate(-150 -420)`);$('sandS6').style.opacity=Math.sin(t*30)>-.6?1:.4}
 for(const r of rings){const d=t-r.t;if(d<0||d>0.6){r.d.style.opacity=0;continue}const p=d/0.6;r.d.style.opacity=0.85*(1-p);r.d.style.transform=`scale(${0.2+eOC(p)*1.3})`;r.d.style.borderWidth=(16*(1-p)+2)+'px'}
 for(const c of conf){const d=t-10.75-c.dl;if(d<0){c.d.style.opacity=0;continue}
  const cy=150+c.vy*d;c.d.style.opacity=cl((cy-150)/60)*cl((900-cy)/120);c.d.style.transform=`translate(${c.x+c.vx*d*0.5+Math.sin(d*4+c.sw)*20}px,${cy}px) rotate(${c.r+c.vr*d}deg) rotateX(${d*400+c.sw*50}deg)`}
};
window.render(0);
</script>
