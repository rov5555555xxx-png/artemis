*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:#fff}
body{font-family:K,sans-serif;color:#1B2A4A}
#stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:#F2F5FF}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.sbg{position:absolute;inset:-60px}
.peach{background:radial-gradient(circle at 50% 35%,#FFF4EA 0%,#FFE0CC 55%,#FFC3A1 100%)}
.sky{background:linear-gradient(180deg,#C7E3FF 0%,#EAF4FF 70%,#FFF6DA 100%)}
.mint{background:radial-gradient(circle at 50% 40%,#F2FFF9 0%,#C9F7E3 55%,#8EE6C2 100%)}
.sun{background:radial-gradient(circle at 50% 40%,#FFFCEB 0%,#FFEFA8 55%,#FFD45E 100%)}
.lilac{background:radial-gradient(circle at 50% 40%,#F6F3FF 0%,#DCD3FF 55%,#B1A2FF 100%)}
.blue{background:radial-gradient(circle at 50% 40%,#EEF3FF 0%,#C8D6FF 55%,#93AEFF 100%)}
.cam{position:absolute;inset:0;will-change:transform}
.a{position:absolute;opacity:0;will-change:transform}
.img{background-position:center;background-size:contain;background-repeat:no-repeat;filter:drop-shadow(0 22px 26px rgba(40,50,90,.35))}

.kt{position:absolute;left:130px;width:820px;text-align:center;font-weight:900;white-space:nowrap;line-height:1.25;color:#FFD23F;-webkit-text-stroke:14px #1B2A4A;paint-order:stroke fill;text-shadow:0 12px 0 #1B2A4A}
.kt .g{display:inline-block;transform-origin:50% 80%;opacity:0}
.stk{display:inline-block;padding:8px 34px 14px;border-radius:999px;font-weight:900;white-space:nowrap;line-height:1.2;border:7px solid #1B2A4A;box-shadow:0 10px 0 #1B2A4A}
.cx{left:130px;width:820px;text-align:center}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9}
.dot{position:absolute;border-radius:50%}
.ring{position:absolute;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;border:16px solid #fff;opacity:0}
.conf{position:absolute;width:18px;height:28px;border-radius:6px}
.rays{position:absolute;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.75) 0 9deg,rgba(255,255,255,0) 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%)}
#stripe{position:absolute;top:-200px;width:2600px;height:1500px;transform:translateX(-3200px) skewX(-14deg)}
#stripe div{position:absolute;top:0;bottom:0;width:140px}
.kid svg,.jar svg{overflow:visible}
.hero svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 20px 22px rgba(40,50,90,.35))}
.jar svg{width:100%;height:100%;display:block;filter:drop-shadow(0 16px 18px rgba(40,50,90,.3))}
.card{position:absolute;display:flex;align-items:center;gap:22px;background:#fff;border:7px solid #1B2A4A;border-radius:34px;padding:14px 30px 14px 18px;box-shadow:0 10px 0 #1B2A4A}
.card .ic{width:92px;height:92px;flex:none}
.card .tx{font-weight:900;font-size:60px;white-space:nowrap;line-height:1.2}
</style></head><body>

 if(gly.length&&t>=10.5&&t<14.2){gly.forEach(g=>{const k=cl((t-10.9-g.i*0.12-(g.sd>0?0.25:0))/0.35);const path=g.sd<0?$('armL4'):$('armR4');const L=path.getTotalLength();const pt=path.getPointAtLength(L*(g.i+0.5)/5);
   g.c.setAttribute('cx',pt.x);g.c.setAttribute('cy',pt.y);g.c.setAttribute('transform',`translate(${pt.x} ${pt.y}) scale(${k?eOB(k):0}) translate(${-pt.x} ${-pt.y})`)});
  ['armL4','armR4'].forEach((id,j)=>{const p=$(id),L=p.getTotalLength(),k=eIO(cl((t-10.85-j*0.25)/0.6));p.setAttribute('stroke-dasharray',L);p.setAttribute('stroke-dashoffset',L*(1-k))});
  const hug=1+0.04*Math.sin(t*6);$('gly4').setAttribute('transform',`rotate(${Math.sin(t*1.5)*4}) scale(${hug})`);$('arms4').setAttribute('transform',`rotate(${Math.sin(t*1.5)*4}) scale(${hug})`)}
 // S6 labels flip to Mg
 if(t>=15.9&&t<18.4)document.querySelectorAll('.jar.flip').forEach((j,i)=>{const k=cl((t-16.92-i*0.15)/0.3);const sx=Math.abs(Math.cos(k*Math.PI));const svg=j.querySelector('svg');
  j.querySelector('.lab').setAttribute('opacity',k<0.5?1:0);j.querySelector('.lab2').setAttribute('opacity',k>=0.5?1:0);svg.style.transform=`scaleX(${k>0&&k<1?Math.max(sx,0.05):1})`});
 // S7 race
 if(runners.length&&t>=17.98&&t<21.9){runners.forEach(r=>{const lt=Math.max(0,t-18.1);let x;
   if(r.i<3)x=70+r.sp*lt*190;else x=lt<1.5?70+lt*60:160+Math.pow(lt-1.5,1.6)*420;x=Math.min(x,r.i<3?600+r.i*25:700);
   const bob=Math.abs(Math.sin(t*12+r.i))*-12;r.e.setAttribute('transform',`translate(${x} ${r.y+bob}) rotate(${Math.sin(t*12+r.i)*8})`);
   r.e.querySelector('.dust').setAttribute('opacity',(r.i==3&&lt>1.7)?1:0)})}
 // S9 arrow bounce
 if($('arrow9')&&t>24.6&&t<25.9){$('arrow9').style.transform+=` translateY(${Math.abs(Math.sin((t-24.6)*6))*22}px)`}
 for(const r of rings){const d=t-r.t;if(d<0||d>0.6){r.d.style.opacity=0;continue}const p=d/0.6;r.d.style.opacity=.9*(1-p);r.d.style.transform=`scale(${0.2+eOC(p)*1.4})`;r.d.style.borderWidth=(16*(1-p)+2)+'px'}
 for(const c of conf){const d=t-29.9-c.dl;if(d<0){c.d.style.opacity=0;continue}const cy=140+c.vy*d;c.d.style.opacity=cl((cy-140)/60)*cl((940-cy)/120);c.d.style.transform=`translate(${c.x+c.vx*d*.5+Math.sin(d*4+c.sw)*20}px,${cy}px) rotate(${c.r+c.vr*d}deg) rotateX(${d*400+c.sw*50}deg)`}
};
