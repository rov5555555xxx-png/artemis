  <div class="a" data-at="22.9" data-an="pop" data-bob="1.5" style="left:1010px;top:420px"><span class="pill p-dark" style="font-size:44px">อยู่นาน 6 ชม.</span></div>
 </div>
 <div class="a big cx wht" data-at="20.9" data-an="up" data-out="23.85" style="top:660px;font-size:80px">เรื่อง<span class="hl" data-hl="21.12">คุณภาพ</span></div>
 <div class="a big cx gold" data-at="23.9" data-an="up" style="top:640px;font-size:74px">สูตรใหม่</div>
 <div class="a cx" data-at="24.3" data-an="slam" style="top:745px;text-align:center"><span class="pill p-gold" style="font-size:76px">ตอบโจทย์กว่าเยอะ!</span></div>
</div>

<div id="rings"></div>
<div id="wipe"><div style="left:-90px;width:90px;background:#2EC4B6"></div><div style="left:0;right:0;background:#16171B"></div><div style="right:-90px;width:90px;background:#D9B98A"></div></div>
<div id="flash"></div>
<div id="safe" style="display:none;position:absolute;left:130px;top:130px;width:1180px;height:820px;border:3px dashed #f0f"></div>
</div>
<script>
const W=1440,H=1080,DUR_T=25.33;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOC=p=>1-Math.pow(1-p,3);
const eOB=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const eIO=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
let seed=9;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
if(location.hash==='#safe')document.getElementById('safe').style.display='block';
document.querySelectorAll('.img.nb,.img.ob,.img.bx').forEach((b,i)=>{const s=document.createElement('div');s.className='shine';s.dataset.ph=i*0.37;b.appendChild(s)});
const scenes=[...document.querySelectorAll('.scene')].map(el=>{
 const bg=document.createElement('div');bg.className='sbg '+el.dataset.bg;el.insertBefore(bg,el.firstChild);
 const pl=document.createElement('div');pl.style.cssText='position:absolute;inset:0;pointer-events:none';el.insertBefore(pl,bg.nextSibling);
 const parts=[];if(el.dataset.bg!=='light'&&el.dataset.bg!=='split')for(let k=0;k<34;k++){const d=document.createElement('div');d.className='dust';const s=2+rnd()*5;d.style.width=d.style.height=s+'px';pl.appendChild(d);parts.push({d,x:170+rnd()*1100,y:rnd()*H,v:10+rnd()*25,ph:rnd()*6.28,tw:rnd()*6})}
 const cam=(el.dataset.cam||'').split(';').filter(Boolean).map(k=>k.split(':').map(Number));
 return{el,s:+el.dataset.s,e:+el.dataset.e,tr:el.dataset.tr||'',parts,cam,camEl:el.querySelector('.cam'),items:[...el.querySelectorAll('.a')]}});
const TR=0.4;
function crCurve(pts){const out=[];const P=pts.map(([h,l])=>[110+h*105,600-l*460]);
 for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
  for(let k=0;k<24;k++){const u=k/24,u2=u*u,u3=u2*u;out.push([0,1].map(j=>0.5*((2*p1[j])+(-p0[j]+p2[j])*u+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*u2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*u3)))}}
 out.push(P[P.length-1]);
 const lut=[];let j=0;for(let x=110;x<=950;x+=2){while(j<out.length-2&&out[j+1][0]<x)j++;const a=out[j],b=out[j+1];const f=b[0]>a[0]?cl((x-a[0])/(b[0]-a[0])):0;lut.push([x,a[1]+(b[1]-a[1])*f])}
 return lut}
const CO=crCurve([[0,0.02],[0.5,0.8],[1,0.93],[1.5,0.95],[2,0.95],[2.6,0.86],[3.2,0.7],[4,0.5],[5,0.32],[6,0.2],[7,0.13],[8,0.09]]);
const CN=crCurve([[0,0.02],[0.5,0.78],[1,0.92],[2,0.94],[4,0.94],[6,0.93],[7,0.68],[8,0.42]]);
if(document.getElementById('lOld')){const d=a=>'M'+a.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
 document.getElementById('lOld').setAttribute('d',d(CO));document.getElementById('aOld').setAttribute('d',d(CO)+'L950 600L110 600Z');
 document.getElementById('lNew').setAttribute('d',d(CN));document.getElementById('aNew').setAttribute('d',d(CN)+'L950 600L110 600Z');}

function camAt(keys,t){if(!keys.length)return[1,720,540];if(t<=keys[0][0])return keys[0].slice(1);
 for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];if(t<=b[0]){const p=eIO(cl((t-a[0])/(b[0]-a[0])));return[1,2,3].map(j=>a[j]+(b[j]-a[j])*p)}}return keys[keys.length-1].slice(1)}
const conf=[];const cw=document.getElementById('confetti');const cc=['#F3D9A4','#D9B98A','#fff','#C0C4CC','#8A6731'];
for(let i=0;i<70;i++){const d=document.createElement('div');d.className='conf';d.style.background=cc[i%5];cw.appendChild(d);conf.push({d,x:200+rnd()*1040,vy:250+rnd()*300,vx:(rnd()-.5)*160,r:rnd()*360,vr:(rnd()-.5)*720,dl:rnd()*0.5,sw:rnd()*6})}
const ringDefs=[[0.55,720,420],[4.46,720,880],[6.05,600,250],[8.55,1010,240],[17.56,720,830],[18.72,1010,880],[24.3,720,800]];
const rw=document.getElementById('rings');const rings=ringDefs.map(([t,x,y])=>{const d=document.createElement('div');d.className='ring';d.style.left=x+'px';d.style.top=y+'px';rw.appendChild(d);return{d,t}});
function animT(an,p){switch(an){
 case 'fade':return[eOC(p),''];
 case 'pop':return[cl(p*4),`scale(${p<=0?0:eOB(p)})`];
 case 'slam':{const e=eOC(p);return[cl(p*5),`scale(${1+1.2*(1-e)})`]}
 case 'stamp':{const e=eOB(p);return[cl(p*5),`scale(${1.6-0.6*e}) rotate(${-6*(1-e)}deg)`]}
 case 'up':{const e=eOB(p);return[cl(p*3),`translateY(${80*(1-e)}px)`]}
 case 'left':{const e=eOB(p);return[cl(p*3),`translateX(${-320*(1-e)}px)`]}
 case 'right':{const e=eOB(p);return[cl(p*3),`translateX(${320*(1-e)}px)`]}
 case 'drop':{const e=eOB(p);return[cl(p*4),`translateY(${-700*(1-e)}px) rotate(${(1-e)*-20}deg)`]}}return[1,'']}
const DUR={fade:.35,pop:.42,slam:.32,stamp:.35,up:.42,left:.45,right:.45,drop:.55};
const $=id=>document.getElementById(id);
window.render=function(t){
 let flash=0;
 scenes.forEach((sc,i)=>{
  const nx=scenes[i+1];const tail=(nx&&(nx.tr==='iris'||nx.tr==='zoom'))?TR:0;
  const on=t>=sc.s&&t<sc.e+tail;sc.el.style.display=on?'block':'none';if(!on)return;
  const lt=t-sc.s,q=cl(lt/TR);let tf='',clip='none',op=1;
  if(sc.tr==='iris')clip=`circle(${eIO(q)*110}% at 50% 50%)`;
  else if(sc.tr==='zoom'){tf=`scale(${1.3-0.3*eOC(q)})`;op=q}
  sc.el.style.transform=tf;sc.el.style.clipPath=q<1?clip:'none';sc.el.style.opacity=op;sc.el.style.zIndex=i;
  const [s,fx,fy]=camAt(sc.cam,t);if(sc.camEl)sc.camEl.style.transform=`translate(720px,540px) scale(${s}) translate(${-fx}px,${-fy}px)`;
  for(const p of sc.parts){const y=((p.y-p.v*t)%(H+100)+H+100)%(H+100)-50;p.d.style.transform=`translate(${p.x+Math.sin(t*.7+p.ph)*20}px,${y}px)`;p.d.style.opacity=(.25+.5*Math.abs(Math.sin(t*1.5+p.tw)))*cl((y-140)/80)*cl((940-y)/80)}
  for(const el of sc.items){
   const at=+el.dataset.at,an=el.dataset.an,p=cl((t-at)/DUR[an]);
   let[o,tr]=t<at?[0,'']:animT(an,p);const live=t-at;
   if(el.dataset.out){const k=cl((t-+el.dataset.out)/0.28);if(k>0){o*=1-k;tr+=` translateY(${-eIO(k)*50}px)`}}
   if(el.dataset.dim){const k=cl((t-+el.dataset.dim)/0.4);o*=1-0.6*k;el.style.filter=k>0?`grayscale(${k}) brightness(${1-0.35*k})`:''}
   if(el.dataset.float){const ph=+el.dataset.float;tr+=` translateY(${Math.sin(t*2.1+ph)*10}px) perspective(1400px) rotateY(${Math.sin(t*1.3+ph)*9}deg)`}
   if(el.dataset.bob){const ph=+el.dataset.bob;tr+=` translateY(${Math.sin(t*3+ph)*8}px)`}
   if(el.dataset.swing&&live>0.35)tr+=` rotate(${Math.sin((live-0.35)*9)*6*Math.exp(-(live-0.35)*1.5)}deg)`;
   if(el.dataset.spin)tr+=` rotate(${t*el.dataset.spin}deg)`;
   el.style.opacity=o;el.style.transform=tr}
 });
 let wx=-3200;for(const sc of scenes){if(sc.tr==='wipe'){const d=t-sc.s;if(d>-0.22&&d<0.22)wx=-3000+eIO((d+0.22)/0.44)*4700}
  if(sc.tr==='flash'){const d=t-sc.s;if(d>=0&&d<0.3)flash=Math.max(flash,0.85*(1-d/0.3))}}
 $('wipe').style.transform=`translateX(${wx}px) skewX(-16deg)`;$('flash').style.opacity=flash;
 document.querySelectorAll('[data-kbi]').forEach(g=>{const d=Math.max(0,t-+g.dataset.kbi);g.style.transform=`scale(${1.02+0.03*d})`});
 document.querySelectorAll('[data-hl]').forEach(h=>{h.style.backgroundSize=`${eIO(cl((t-+h.dataset.hl)/0.35))*100}% 100%`});
 if($('lOld')&&t>=5.15&&t<9.9){
  const rv=(a,d)=>eIO(cl((t-a)/d));const po=rv(5.45,1.45),pn=rv(7.0,1.6),W8=840;
  $('rOld').setAttribute('width',po*W8+(po>0?14:0));$('rNew').setAttribute('width',pn*W8+(pn>0?14:0));
  const yAt=(arr,x)=>{let i=Math.min(arr.length-1,Math.max(0,Math.round((x-110)/2)));return arr[i][1]};
  if(po>0&&po<1){const x=110+po*W8;$('dOld').setAttribute('cx',x);$('dOld').setAttribute('cy',yAt(CO,x));$('dOld').setAttribute('opacity',1)}else $('dOld').setAttribute('opacity',0);
  if(pn>0&&pn<1){const x=110+pn*W8;$('dNew').setAttribute('cx',x);$('dNew').setAttribute('cy',yAt(CN,x));$('dNew').setAttribute('opacity',1)}else $('dNew').setAttribute('opacity',0);
  $('gOldG').style.opacity=1-0.55*cl((t-7.2)/0.4);
  $('m2').setAttribute('opacity',cl((t-5.95)/0.25));$('m6').setAttribute('opacity',cl((t-8.5)/0.25));
  $('band6').setAttribute('opacity',0.14*cl((t-8.2)/0.4));
 }
 document.querySelectorAll('[data-bar]').forEach(b=>{const[a,d,w]=b.dataset.bar.split(',').map(Number);b.style.width=(eOC(cl((t-a)/d))*w*100)+'%'});
 document.querySelectorAll('.shine').forEach(s=>{const c=((t*0.5+ +s.dataset.ph)%1.7);s.style.backgroundPosition=`${110-c/1.7*130}% 0`});
 for(const r of rings){const d=t-r.t;if(d<0||d>0.6){r.d.style.opacity=0;continue}const p=d/0.6;r.d.style.opacity=.8*(1-p);r.d.style.transform=`scale(${0.2+eOC(p)*1.3})`;r.d.style.borderWidth=(16*(1-p)+2)+'px'}
 for(const c of conf){const d=t-24.3-c.dl;if(d<0){c.d.style.opacity=0;continue}const cy=140+c.vy*d;c.d.style.opacity=cl((cy-140)/60)*cl((940-cy)/120);c.d.style.transform=`translate(${c.x+c.vx*d*.5+Math.sin(d*4+c.sw)*20}px,${cy}px) rotate(${c.r+c.vr*d}deg) rotateX(${d*400+c.sw*50}deg)`}
};
window.render(0);
</script>
