<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><style>
@font-face{font-family:K;font-weight:900;src:url(kanit-latin-900-normal.woff2)}
@font-face{font-family:K;font-weight:900;src:url(kanit-thai-900-normal.woff2);unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:K;font-weight:800;src:url(kanit-latin-800-normal.woff2)}
@font-face{font-family:K;font-weight:800;src:url(kanit-thai-800-normal.woff2);unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
*{margin:0;padding:0}html,body{width:1440px;height:1080px;overflow:hidden;background:#000}
#sv{position:absolute;inset:0}
.cap{position:absolute;left:0;width:1440px;text-align:center;font-family:K;font-weight:900;white-space:nowrap}
.cap span{display:inline-block;padding:8px 46px 18px;border-radius:999px;background:rgba(255,255,255,.92);color:#2B2A33;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.cap b{color:var(--k)}
</style></head><body>
<svg id="sv" viewBox="0 0 1440 1080" width="1440" height="1080"></svg>
<div class="cap" id="c1" style="top:760px;font-size:78px"></div>
<div class="cap" id="c0" style="top:640px;font-size:62px"></div>
<script>
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),eOC=p=>1-Math.pow(1-p,3),eIO=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,eOB=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)},lerp=(a,b,p)=>a+(b-a)*p;
const mix=(c1,c2,p)=>{const h=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));const a=h(c1),b=h(c2);return '#'+a.map((v,i)=>Math.round(lerp(v,b[i],p)).toString(16).padStart(2,'0')).join('')};
const INK='#3A2E39';
// captions: [start,end,small,big(with <b>)]
const CAPS=[[-1,2.35,'สาระ 8 วิ','ทำไม<b style="--k:#D7263D">แอสตาแซนธิน</b>ถึงสีแดง?'],[2.4,3.8,'','ทีแรกมันเป็น<b style="--k:#2E9E4F">สีเขียว</b>'],[3.85,5.95,'','เจอ<b style="--k:#F08A00">แดด</b> เกิด<b style="--k:#E4572E">ความร้อน</b>'],[6.0,7.25,'','สร้าง<b style="--k:#D7263D">สารกันแดด</b>ขึ้นมา'],[7.3,99,'','กลายเป็น<b style="--k:#D7263D">สีแดง</b>เฉยเลย!']];
function capRender(t){const c=CAPS.find(c=>t>=c[0]&&t<c[1])||CAPS[0];const k=c[0]<0?1:eOB(cl((t-c[0])/0.3));const o=c[1]<99?1-cl((t-(c[1]-0.15))/0.15):1;
 const el=document.getElementById('c1');if(el.dataset.k!==c[3]){el.innerHTML=c[2]||c[3]?`<span>${c[3]}</span>`:'';el.dataset.k=c[3]}el.style.transform=`translateY(${(1-k)*40}px) scale(${0.9+0.1*k})`;el.style.opacity=o*cl(k*2);
 const e0=document.getElementById('c0');e0.innerHTML=c[2]?`<span style="background:#D7263D;color:#fff;font-size:44px;padding:4px 30px 10px">${c[2]}</span>`:'';e0.style.opacity=o}
// algae cell character
function cell(x,y,s,redP,face,sweat,shield,t){const body=mix('#5CC46A','#D7263D',redP),rim=mix('#2E8B45','#8E1428',redP),dots=mix('#9BE38F','#FF7A7A',redP);
 let g=`<g transform="translate(${x} ${y}) scale(${s})">`;
 if(shield>0)g+=`<circle r="${170+10*Math.sin(t*6)}" fill="none" stroke="#FF5A5F" stroke-width="${14*shield}" opacity="${0.55*shield}"/><circle r="150" fill="#FF3B47" opacity="${0.18*shield}"/>`;
 g+=`<circle r="132" fill="${rim}"/><circle r="120" fill="${body}"/>`;
 for(let i=0;i<9;i++){const a=i*0.7+1,r=40+((i*37)%60);g+=`<circle cx="${Math.cos(a)*r}" cy="${Math.sin(a)*r}" r="${10+(i%3)*5}" fill="${dots}" opacity=".7"/>`}
 g+=`<ellipse cx="-50" cy="-60" rx="34" ry="20" fill="#fff" opacity=".45"/>`;
 const ey=face==='hot'?`<path d="M-50 -8q14 -10 28 0M22 -8q14 -10 28 0" stroke="${INK}" stroke-width="9" fill="none" stroke-linecap="round"/>`:`<ellipse cx="-36" cy="-6" rx="11" ry="14" fill="${INK}"/><ellipse cx="36" cy="-6" rx="11" ry="14" fill="${INK}"/><circle cx="-32" cy="-11" r="4" fill="#fff"/><circle cx="40" cy="-11" r="4" fill="#fff"/>`;
 const mo=face==='hot'?`<path d="M-20 38q20 -14 40 0" stroke="${INK}" stroke-width="9" fill="none" stroke-linecap="round"/>`:face==='proud'?`<path d="M-26 26q26 30 52 0z" fill="${INK}"/>`:face==='q'?`<ellipse cx="0" cy="34" rx="12" ry="14" fill="${INK}"/>`:`<path d="M-24 28q24 22 48 0" stroke="${INK}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
 g+=ey+mo+`<ellipse cx="-62" cy="22" rx="16" ry="10" fill="#FF8FA3" opacity=".75"/><ellipse cx="62" cy="22" rx="16" ry="10" fill="#FF8FA3" opacity=".75"/>`;
 if(sweat>0)for(let i=0;i<3;i++){const d=((t*1.4+i/3)%1);g+=`<path transform="translate(${100+i*18} ${-90+d*60})" d="M0 -16q12 18 0 26q-12 -8 0 -26z" fill="#7FD3FF" stroke="${INK}" stroke-width="3" opacity="${sweat*(1-d)}"/>`}
 return g+'</g>'}
function sun(x,y,s,t){return `<g transform="translate(${x} ${y}) scale(${s}) rotate(${t*25})">${[...Array(14)].map((_,i)=>`<path d="M0 -150L16 -110H-16Z" fill="#FFC23A" transform="rotate(${i*360/14})"/>`).join('')}<circle r="96" fill="#FFD84D" stroke="#FFB000" stroke-width="10"/></g>`}
function bg(t){ // colour story: red title -> green pond -> orange heat -> red sunset
 const k1=cl((t-2.2)/0.4),k2=cl((t-3.8)/0.6),k3=cl((t-6.0)/1.0);
 let top='#5A1424',bot='#2A0A12';
 top=mix(top,'#BFEFD0',k1);bot=mix(bot,'#5CC4A0',k1);top=mix(top,'#FFB347',k2);bot=mix(bot,'#FF7B3A',k2);top=mix(top,'#FF7A6B',k3);bot=mix(bot,'#B3122E',k3);
 let s=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient><radialGradient id="sp" cx=".5" cy=".42" r=".45"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="1440" height="1080" fill="url(#g)"/>`;
 // pond water band + tubes farm (green part)
 const w=k1*(1-k3*0.6);
 s+=`<g opacity="${w}">${[...Array(9)].map((_,i)=>`<rect x="${60+i*155}" y="160" width="46" height="560" rx="23" fill="${mix('#9FE3B0','#FFB07A',k2)}" opacity=".55"/>`).join('')}</g>`;
 s+=`<path d="M0 ${820+Math.sin(t*2)*6} Q360 ${790} 720 ${820} T1440 ${815} V1080H0Z" fill="${mix(mix(mix('#2A0A12','#3FA37A',k1),'#C9561E',k2),'#7A0E22',k3)}" opacity=".9"/>`;
 for(let i=0;i<10;i++){const d=((t*0.4+i/10)%1);s+=`<circle cx="${150+i*125}" cy="${950-d*700}" r="${6+(i%3)*4}" fill="#fff" opacity="${0.35*k1*(1-k2)*(1-d)}"/>`}
 // heat shimmer lines
 for(let i=0;i<6;i++){s+=`<path d="M${180+i*220} 900q20 -30 0 -60t0 -60" stroke="#fff" stroke-width="6" fill="none" opacity="${0.25*k2*(0.5+0.5*Math.sin(t*6+i))}" stroke-linecap="round"/>`}
 return s+`<rect width="1440" height="1080" fill="url(#sp)"/>`}
window.render=function(t){let s=bg(t);
 // title drop / question
 if(t<2.6){const p=1-cl((t-2.2)/0.4);s+=`<g opacity="${p}"><g transform="translate(470 370)"><path d="M0 -150C60 -60 110 0 110 60a110 110 0 0 1 -220 0C-110 0 -60 -60 0 -150z" fill="#C8102E" stroke="#5A0A16" stroke-width="10"/><ellipse cx="-40" cy="20" rx="26" ry="40" fill="#fff" opacity=".35"/></g><text x="470" y="430" text-anchor="middle" font-family="K" font-weight="900" font-size="54" fill="#fff">ASX</text></g>`;
  s+=`<g opacity="${p}">`+cell(940,370,0.95,0,'q',0,0,t)+`<g transform="translate(1080 210) rotate(${Math.sin(t*5)*10})"><circle r="52" fill="#fff" stroke="${INK}" stroke-width="6"/><text y="28" text-anchor="middle" font-family="K" font-weight="900" font-size="80" fill="#D7263D">?</text></g></g>`;}
 if(t>=2.2){const k=eOB(cl((t-2.3)/0.5));const heat=cl((t-3.9)/0.8);const red=eIO(cl((t-6.4)/1.6));const shield=cl((t-6.0)/0.5);
  const sunP=eOC(cl((t-3.8)/0.8));if(t>3.6)s+=sun(lerp(1500,1120,sunP),lerp(-150,170,sunP),1.0+0.04*Math.sin(t*8),t);
  if(t>3.9&&t<6.4)for(let i=0;i<5;i++){const d=((t*1.6+i/5)%1);s+=`<path d="M${1040-d*260+i*12} ${230+d*120+i*14}l-40 22" stroke="#FFE08A" stroke-width="10" stroke-linecap="round" opacity="${(1-d)*heat}"/>`}
  // thermometer
  if(t>4.2&&t<6.5){const q=cl((t-4.3)/1.3),o=1-cl((t-6.1)/0.3);s+=`<g transform="translate(300 380)" opacity="${o}"><rect x="-26" y="-180" width="52" height="260" rx="26" fill="#fff" stroke="${INK}" stroke-width="7"/><rect x="-12" y="${60-200*q}" width="24" height="${200*q+20}" rx="12" fill="#E4572E"/><circle cy="100" r="42" fill="#E4572E" stroke="${INK}" stroke-width="7"/></g>`}
  const face=t<3.9?'happy':t<6.0?'hot':'proud';
  s+=cell(720,400+Math.sin(t*2.5)*8,1.15*k,red,face,t>4.2&&t<6.2?1:0,shield,t);
  // colour-stage dots (like the reference) under the cell at the end
  if(t>7.3){const q=cl((t-7.4)/0.6);for(let i=0;i<4;i++){const kk=eOB(cl((q*4-i)));s+=`<g transform="translate(${510+i*140} 640) scale(${kk})"><circle r="42" fill="${mix('#5CC46A','#D7263D',i/3)}" stroke="${INK}" stroke-width="5"/></g>`+(i<3?`<path d="M${555+i*140} 640h50" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="${kk}"/>`:'')}}
  if(t>6.0&&t<7.6){const q=cl((t-6.0)/0.4),o=1-cl((t-7.3)/0.3);s+=`<g transform="translate(1060 300) scale(${eOB(q)})" opacity="${o}"><path d="M0 -70L60 -46V6Q60 52 0 76Q-60 52 -60 6V-46Z" fill="#D7263D" stroke="#fff" stroke-width="7"/><text y="20" text-anchor="middle" font-family="K" font-weight="900" font-size="40" fill="#fff">UV</text><path d="M-40 -40L40 40" stroke="#fff" stroke-width="8"/></g>`}
 }
 document.getElementById('sv').innerHTML=s;capRender(t)};
render(0);
</script></body></html>
