<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><style>
@font-face{font-family:K;font-weight:600;src:url(kanit-latin-600-normal.woff2)}
@font-face{font-family:K;font-weight:800;src:url(kanit-latin-800-normal.woff2)}
@font-face{font-family:K;font-weight:900;src:url(kanit-latin-900-normal.woff2)}
@font-face{font-family:K;font-weight:600;src:url(kanit-thai-600-normal.woff2);unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:K;font-weight:800;src:url(kanit-thai-800-normal.woff2);unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:K;font-weight:900;src:url(kanit-thai-900-normal.woff2);unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1440px;height:1080px;overflow:hidden;background:#fff}
body{font-family:K,sans-serif;color:#1B2A4A}
#stage{position:relative;width:1440px;height:1080px;overflow:hidden;background:#FFF6E9}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.sbg{position:absolute;inset:-60px}
.peach{background:radial-gradient(circle at 50% 35%,#FFF4EA 0%,#FFE0CC 55%,#FFC3A1 100%)}
.sky{background:linear-gradient(180deg,#BFE8FF 0%,#E6F7FF 70%,#FFF6DA 100%)}
.mint{background:radial-gradient(circle at 50% 40%,#F2FFF9 0%,#C9F7E3 55%,#8EE6C2 100%)}
.sun{background:radial-gradient(circle at 50% 40%,#FFFCEB 0%,#FFEFA8 55%,#FFD45E 100%)}
.lilac{background:radial-gradient(circle at 50% 40%,#F8F3FF 0%,#E3D6FF 55%,#C3A9FF 100%)}
.pink{background:radial-gradient(circle at 50% 40%,#FFF5F8 0%,#FFD9E4 55%,#FFADC4 100%)}
.cam{position:absolute;inset:0;will-change:transform}
.a{position:absolute;opacity:0;will-change:transform}
.img{background-position:center;background-size:contain;background-repeat:no-repeat;filter:drop-shadow(0 22px 26px rgba(40,50,90,.35))}
.nb{background-image:url(new_bottle.png)}.bx{background-image:url(new_box.png);filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9)) drop-shadow(0 22px 26px rgba(40,50,90,.35))}
.kt{position:absolute;left:130px;width:1180px;text-align:center;font-weight:900;white-space:nowrap;line-height:1.25;color:#FFD23F;-webkit-text-stroke:14px #1B2A4A;paint-order:stroke fill;text-shadow:0 12px 0 #1B2A4A}
.kt .g{display:inline-block;transform-origin:50% 80%;opacity:0}
.stk{display:inline-block;padding:8px 36px 14px;border-radius:999px;font-weight:900;white-space:nowrap;line-height:1.2;border:7px solid #1B2A4A;box-shadow:0 10px 0 #1B2A4A}
.cx{left:130px;width:1180px;text-align:center}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9}
.dot{position:absolute;border-radius:50%}
.ring{position:absolute;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;border:16px solid #fff;opacity:0}
.conf{position:absolute;width:20px;height:30px;border-radius:6px}
.rays{position:absolute;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.75) 0 9deg,rgba(255,255,255,0) 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%)}
#stripe{position:absolute;top:-200px;width:3000px;height:1500px;transform:translateX(-3600px) skewX(-14deg)}
#stripe div{position:absolute;top:0;bottom:0;width:160px}
.kid svg,.jar svg{overflow:visible}
.jar svg{width:100%;height:100%;display:block;filter:drop-shadow(0 16px 18px rgba(40,50,90,.3))}
.hero svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 20px 22px rgba(40,50,90,.35))}
.capsvg{position:absolute;width:260px;height:600px;transform-origin:50% 50%}
.capsvg svg{width:100%;height:100%;display:block;overflow:visible}
.bub{position:absolute;display:flex;flex-direction:column;align-items:center;gap:8px}
.bub .c{width:230px;height:230px;border-radius:50%;border:8px solid #1B2A4A;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 0 #1B2A4A}
.bub .c svg{width:150px;height:150px}
.photo{position:absolute;border-radius:30px;overflow:hidden;border:9px solid #fff;box-shadow:0 0 0 7px #1B2A4A,0 22px 40px rgba(27,42,74,.35)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
<style>.kt .g{opacity:1} .kt{position:absolute;text-align:left;left:auto;width:auto}</style></head><body>
<div id="stage">
 <div class="sbg sun" style="position:absolute;inset:-60px"></div>
 <div class="rays" style="position:absolute;left:40px;top:40px;width:760px;height:760px;transform:rotate(8deg)"></div>
 <div class="hero" style="position:absolute;left:150px;top:200px;width:480px;height:480px;transform:rotate(-8deg)"></div>
 <div style="position:absolute;left:130px;top:800px;width:1180px;text-align:center"><span class="stk" style="font-size:46px;background:#7FD3FF;margin:0 10px">โกรทฮอร์โมน</span><span class="stk" style="font-size:46px;background:#FFB36B;margin:0 10px">เผาผลาญ</span><span class="stk" style="font-size:46px;background:#FF8FB1;margin:0 10px">ฮอร์โมนเพศ</span></div>
 <div class="kt" style="left:690px;top:130px;font-size:230px;color:#FFD23F;transform:rotate(-4deg)">ซิงค์</div>
 <div class="kt" style="left:730px;top:420px;font-size:112px;color:#fff">สำคัญกับ</div>
 <div class="kt" style="left:680px;top:560px;font-size:150px;color:#FF6B6B;transform:rotate(-3deg)">ฮอร์โมน!</div>
 <div style="position:absolute;left:150px;top:150px"><span class="stk" style="font-size:44px;background:#3DDC97;transform:rotate(-6deg);display:inline-block">รู้ยัง?</span></div>
</div>
<script>
const INK='#1B2A4A';let seed=5;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function heroSvg(sym='Zn',name='ZINC'){const id='h'+Math.floor(rnd()*1e6);
 const bub=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${id}s)" stroke="${INK}" stroke-width="3" stroke-opacity=".6"/><ellipse cx="${x-r*.3}" cy="${y-r*.38}" rx="${r*.38}" ry="${r*.22}" fill="#fff" opacity=".85"/>`;
 return `<svg viewBox="-110 -110 220 220"><defs>
 <radialGradient id="${id}s" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".3" stop-color="#E9ECF2"/><stop offset=".72" stop-color="#AEB6C6"/><stop offset="1" stop-color="#7C8699"/></radialGradient>
 <linearGradient id="${id}t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A94AA"/><stop offset=".55" stop-color="#4A5468"/><stop offset="1" stop-color="#2B3245"/></linearGradient>
 <radialGradient id="${id}h" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
 <circle r="96" fill="url(#${id}s)" stroke="${INK}" stroke-width="5" stroke-opacity=".75"/>
 <ellipse cx="-26" cy="-50" rx="46" ry="26" fill="url(#${id}h)"/>
 <text x="0" y="22" text-anchor="middle" font-family="K" font-weight="900" font-size="88" fill="url(#${id}t)" stroke="#fff" stroke-width="7" paint-order="stroke fill">${sym}</text>
 <text x="0" y="56" text-anchor="middle" font-family="K" font-weight="900" font-size="21" letter-spacing="1" fill="url(#${id}t)" stroke="#fff" stroke-width="4" paint-order="stroke fill">${name}</text>
 <g class="bubs">${bub(-92,-80,17)}${bub(88,74,13)}${bub(-78,88,20)}${bub(96,-60,10)}</g></svg>`}

function face(e){const k=`stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"`;let s='';
 if(e==='happy')s=`<path d="M-48 -8q16-18 32 0M16 -8q16-18 32 0" ${k}/><path d="M-30 22Q0 62 30 22z" fill="${INK}"/><path d="M-16 40q16 12 32 0" fill="#FF6B6B"/>`;
 else if(e==='wow')s=`<ellipse cx="-30" cy="-6" rx="15" ry="19" fill="${INK}"/><ellipse cx="30" cy="-6" rx="15" ry="19" fill="${INK}"/><circle cx="-25" cy="-13" r="6" fill="#fff"/><circle cx="35" cy="-13" r="6" fill="#fff"/><ellipse cx="0" cy="38" rx="13" ry="17" fill="${INK}"/>`;
 else if(e==='bored')s=`<path d="M-48 -4h30M18 -4h30" ${k}/><path d="M-18 36q9-7 18 0t18 0" ${k}/>`;
 else s=`<circle cx="-30" cy="-6" r="9" fill="${INK}"/><circle cx="30" cy="-6" r="9" fill="${INK}"/><path d="M-18 34q18-10 36 0" ${k}/>`;
 return s+`<ellipse cx="-58" cy="20" rx="16" ry="10" fill="#FF8FA3" opacity=".7"/><ellipse cx="58" cy="20" rx="16" ry="10" fill="#FF8FA3" opacity=".7"/>`}
function hair(st,c){if(st==='bun')return `<circle cx="0" cy="-118" r="34" fill="${c}" stroke="${INK}" stroke-width="6"/><path d="M-104 0C-114 -150 114 -150 104 0C92 -44 44 -66 0 -60C-44 -66 -92 -44 -104 0z" fill="${c}" stroke="${INK}" stroke-width="6"/>`;
 return `<path d="M-104 4C-114 -150 114 -150 104 4C96 -40 50 -64 6 -50C-20 -70 -70 -58 -104 4z" fill="${c}" stroke="${INK}" stroke-width="6"/>`}
function kid(o){const sk='#FFD7B5',sh=o.shirt||'#FF8FB1',hr=o.hair||'#2B1B12';let s='';
 const arm=(sd,k)=>{const sx=sd*70,sy=-170;let ex,ey;if(k==='up'){ex=sd*130;ey=-330}else if(k==='hold'){ex=sd*120;ey=-200}else if(k==='thumb'){ex=sd*125;ey=-250}else{ex=sd*95;ey=-40}
  let h=`<path d="M${sx} ${sy}L${ex} ${ey}" stroke="${INK}" stroke-width="44" stroke-linecap="round"/><path d="M${sx} ${sy}L${ex} ${ey}" stroke="${sh}" stroke-width="32" stroke-linecap="round"/><circle cx="${ex}" cy="${ey}" r="24" fill="${sk}" stroke="${INK}" stroke-width="6"/>`;
  if(k==='thumb')h+=`<rect x="${ex-10}" y="${ey-62}" width="20" height="46" rx="10" fill="${sk}" stroke="${INK}" stroke-width="6"/>`;return h};
 s+=arm(-1,o.armL||'down')+arm(1,o.armR||'down');
 s+=`<path d="M-100 20V-130a50 50 0 0150-50h100a50 50 0 0150 50V20z" fill="${sh}" stroke="${INK}" stroke-width="7"/><path d="M-34 -180q34 40 68 0" fill="#fff" stroke="${INK}" stroke-width="6"/>`;
 s+=`<g transform="translate(0 -290)"><circle cx="-104" cy="6" r="22" fill="${sk}" stroke="${INK}" stroke-width="6"/><circle cx="104" cy="6" r="22" fill="${sk}" stroke="${INK}" stroke-width="6"/><circle r="104" fill="${sk}" stroke="${INK}" stroke-width="7"/>${hair(o.hairStyle,hr)}`;
 (o.faces||[{e:'happy'}]).forEach(f=>{s+=`<g ${f.vis?`data-vis="${f.vis}"`:''}>${face(f.e)}</g>`});s+='</g>';return s}

document.querySelectorAll('.hero').forEach(e=>e.innerHTML=heroSvg('Zn','ZINC'));
document.querySelectorAll('[data-kid]').forEach(g=>g.innerHTML=kid(JSON.parse(g.dataset.kid)));
window.render=()=>{};
</script></body></html>
