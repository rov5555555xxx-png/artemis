<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0d0d18;font-family:'Prompt',sans-serif}
.scene{position:absolute;inset:0;opacity:0;overflow:hidden}
.scene>svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
.art{position:absolute;inset:0;transform-origin:540px 760px}
#subs{position:absolute;left:0;right:0;top:1170px;height:400px;z-index:500}
.sub{position:absolute;left:50px;right:50px;top:0;text-align:center;opacity:0}
.tag{display:inline-block;font-size:26px;font-weight:600;padding:2px 18px;border-radius:999px;margin-bottom:10px;letter-spacing:1px}
.tag.u{background:#d9a53a;color:#2a1d08}.tag.n{background:#5fb3e0;color:#08202c}
.th{font-weight:700;font-size:62px;color:#fff;line-height:1.35;text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 28px rgba(0,0,0,.75)}
.hl{color:#ffd24a}
.bad{background:#d63a4a;padding:0 14px;border-radius:10px;text-shadow:none}
.en{display:inline-block;margin-top:16px;font-weight:400;font-size:31px;color:#f2ede4;background:rgba(14,14,24,.66);padding:8px 22px;border-radius:12px;line-height:1.35}
.year{position:absolute;left:50px;top:90px;background:#efe6d2;border-radius:10px;padding:14px 26px 12px 22px;box-shadow:0 12px 30px rgba(0,0,0,.45);border-left:8px solid #c9a24a;color:#2b261f}
.year .yk{font-size:26px;font-weight:600;display:flex;align-items:center;gap:8px}
.year .yv{font-family:'Courier Prime',monospace;font-size:66px;line-height:1;margin-top:4px;letter-spacing:2px}
.year .yv small{font-family:'Prompt';font-size:28px;font-weight:600;letter-spacing:0;margin-right:8px}
.card{position:absolute;background:#f4eddc;color:#2b261f;border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:24px 30px;border-left:10px solid #d9a53a}
.card h3{margin:0;font-size:38px;font-weight:700;line-height:1.3}
.card .k{font-size:19px;letter-spacing:2px;color:#8a7b66;font-weight:600;text-transform:uppercase}
.row{display:flex;justify-content:space-between;gap:24px;font-size:31px;padding:12px 0;border-top:2px solid #e3d9c4}
.ok{color:#2f9a55;font-weight:700}.no{color:#d63a4a;font-weight:700}
.src{position:absolute;left:50%;transform:translateX(-50%);top:1090px;font-size:22px;color:#efe6d6;background:rgba(0,0,0,.5);padding:7px 18px;border-radius:999px;white-space:nowrap}
.src b{background:#efe6d6;color:#222;font-size:16px;padding:2px 8px;border-radius:4px;margin-right:10px;letter-spacing:1px}
.chip{position:absolute;font-size:30px;font-weight:600;padding:6px 22px;border-radius:999px}
#grain{position:absolute;inset:0;z-index:400;opacity:.07;pointer-events:none;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;z-index:401;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#black{position:absolute;inset:0;z-index:600;background:#000;opacity:0}
.grid{display:grid;grid-template-columns:repeat(20,1fr);gap:5px;margin-top:16px}
.grid i{display:block;aspect-ratio:1;border-radius:4px;background:#e3d9c4}
.grid i.on{background:#f08a3c}
.strike{position:relative;display:inline-block;color:#b9ad98}
.strike:after{content:'';position:absolute;left:-6px;top:52%;height:6px;background:#d63a4a;width:var(--w,0%);border-radius:3px}
</style></head>
<body>
<div id="stage">
  <div id="grain"></div><div id="vig"></div>
  <div id="subs"></div>
  <div id="black"></div>
</div>
<script src="timeline.js"></script>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const ramp=(t,a,b)=>clamp((t-a)/(b-a));
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PIN='<svg width="22" height="26" viewBox="0 0 22 26"><path d="M11 25C11 25 2 15 2 9.5A9 9 0 0 1 20 9.5C20 15 11 25 11 25Z" fill="none" stroke="#2b261f" stroke-width="2.5"/><circle cx="11" cy="9.5" r="3" fill="#2b261f"/></svg>';
const year=(k,v,pre='ค.ศ.')=>`<div class="year" data-at="0.3"><div class="yk">${PIN} ${k}</div><div class="yv"><small>${pre}</small>${v}</div></div>`;
const src=s=>`<div class="src" data-at="0.8"><b>SOURCE</b>${s}</div>`;

/* ---------- characters ---------- */
function eyes(P,c){return `<g id="${P}-eyes"><ellipse cx="-18" cy="6" rx="5" ry="6.5" fill="${c}"/><ellipse cx="18" cy="6" rx="5" ry="6.5" fill="${c}"/></g>`}
function nephew(){
  const skin='#e8b48c',shirt='#f2efe8';
  return `<g id="N">
  <rect x="-80" y="-20" width="160" height="230" rx="26" fill="#262636"/>
  <rect x="-6" y="250" width="12" height="150" fill="#1b1b26"/>
  <path d="M-70 430 L70 430" stroke="#1b1b26" stroke-width="12" stroke-linecap="round"/>
  <circle cx="-70" cy="436" r="9" fill="#111"/><circle cx="70" cy="436" r="9" fill="#111"/><circle cx="0" cy="436" r="9" fill="#111"/>
  <rect x="-58" y="200" width="116" height="52" rx="20" fill="#2f3a5a"/>
  <rect x="-52" y="236" width="38" height="146" rx="14" fill="#2f3a5a"/><rect x="14" y="236" width="38" height="146" rx="14" fill="#2f3a5a"/>
  <ellipse cx="-36" cy="388" rx="26" ry="11" fill="#2a2420"/><ellipse cx="36" cy="388" rx="26" ry="11" fill="#2a2420"/>
  <rect x="-12" y="34" width="24" height="26" fill="${skin}"/>
  <path d="M-62 215 L-54 82 Q-52 60 -30 55 L30 55 Q52 60 54 82 L62 215 Z" fill="${shirt}"/>
  <path d="M-16 56 L0 82 L16 56" fill="none" stroke="#d6d1c6" stroke-width="4"/>
  <line x1="0" y1="82" x2="0" y2="210" stroke="#dcd7cc" stroke-width="3"/>
  <g><path d="M-50 86 L-66 160 L-42 214" fill="none" stroke="${shirt}" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-40" cy="218" r="13" fill="${skin}"/></g>
  <g id="N-armDown"><path d="M50 86 L66 160 L42 214" fill="none" stroke="${shirt}" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="218" r="13" fill="${skin}"/></g>
  <g id="N-armHold"><path d="M50 86 L84 150 L66 74" fill="none" stroke="${shirt}" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
     <g id="N-bottle"><rect x="52" y="22" width="34" height="46" rx="6" fill="#fff"/><rect x="50" y="12" width="38" height="14" rx="4" fill="#e0782f"/><rect x="52" y="34" width="34" height="18" fill="#f2a33a"/><text x="69" y="48" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">D3</text></g>
     <g id="N-capsule"><rect x="54" y="40" width="34" height="16" rx="8" fill="#f2a33a"/><rect x="54" y="40" width="17" height="16" rx="8" fill="#fbd27a"/></g>
     <circle cx="66" cy="70" r="13" fill="${skin}"/></g>
  <g id="N-armScratch"><path d="M50 86 L88 120 L52 -30" fill="none" stroke="${shirt}" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="-36" r="13" fill="${skin}"/></g>
  <circle cx="-50" cy="6" r="10" fill="${skin}"/><circle cx="50" cy="6" r="10" fill="${skin}"/>
  <circle cx="0" cy="0" r="50" fill="${skin}"/>
  <path d="M-53 2 Q-58 -62 0 -62 Q58 -62 53 2 Q46 -30 14 -32 Q-14 -40 -53 2 Z" fill="#1d1b22"/>
  ${eyes('N','#222')}
  <g id="N-brows"><path id="N-bl" d="M-27 -10 L-10 -12" stroke="#1d1b22" stroke-width="5" stroke-linecap="round"/><path id="N-br" d="M10 -12 L27 -10" stroke="#1d1b22" stroke-width="5" stroke-linecap="round"/></g>
  <path id="N-mc" d="M-10 28 Q0 33 10 28" stroke="#7a3a2a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse id="N-mo" cx="0" cy="30" rx="8" ry="6" fill="#6b2a2a"/>
  <text id="N-q" x="60" y="-70" font-size="70" font-weight="700" fill="#ffd24a">?</text>
  <text id="N-x" x="44" y="-66" font-size="64" font-weight="700" fill="#ffd24a">!?</text>
  </g>`;
}
function uncle(){
  const skin='#dfa77c',card='#7a5236';
  return `<g id="U">
  <rect x="-115" y="-50" width="230" height="300" rx="46" fill="#2f6b55"/>
  <rect x="-115" y="-50" width="230" height="40" rx="20" fill="#357a61"/>
  <rect x="-80" y="210" width="160" height="70" rx="18" fill="#2a5f4b"/>
  <rect x="-58" y="200" width="116" height="52" rx="20" fill="#4a4038"/>
  <rect x="-52" y="236" width="38" height="140" rx="14" fill="#4a4038"/><rect x="14" y="236" width="38" height="140" rx="14" fill="#4a4038"/>
  <ellipse cx="-36" cy="382" rx="26" ry="11" fill="#1f1a16"/><ellipse cx="36" cy="382" rx="26" ry="11" fill="#1f1a16"/>
  <rect x="-140" y="140" width="56" height="150" rx="24" fill="#2a5f4b"/><rect x="84" y="140" width="56" height="150" rx="24" fill="#2a5f4b"/>
  <rect x="-110" y="280" width="16" height="40" fill="#3a2a20"/><rect x="94" y="280" width="16" height="40" fill="#3a2a20"/>
  <rect x="-12" y="34" width="24" height="26" fill="${skin}"/>
  <path d="M-62 215 L-56 82 Q-54 60 -30 55 L30 55 Q54 60 56 82 L62 215 Z" fill="${card}"/>
  <path d="M-18 56 L0 120 L18 56 Z" fill="#efe9dd"/>
  <circle cx="-6" cy="140" r="4" fill="#4a3020"/><circle cx="-6" cy="170" r="4" fill="#4a3020"/>
  <path d="M-52 86 L-70 160 L-42 214" fill="none" stroke="${card}" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-40" cy="218" r="13" fill="${skin}"/>
  <path d="M52 86 L74 168 L36 150" fill="none" stroke="${card}" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="U-steam" opacity=".5"><path id="U-s1" d="M24 112 Q16 96 26 82 Q34 68 26 54" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><path id="U-s2" d="M42 112 Q50 98 42 84 Q34 70 42 58" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <path d="M14 120 L54 120 L50 152 Q34 160 18 152 Z" fill="#f2efe6"/><path d="M54 128 Q66 132 54 144" stroke="#f2efe6" stroke-width="5" fill="none"/>
  <circle cx="28" cy="152" r="13" fill="${skin}"/>
  <circle cx="-50" cy="6" r="10" fill="${skin}"/><circle cx="50" cy="6" r="10" fill="${skin}"/>
  <circle cx="0" cy="0" r="50" fill="${skin}"/>
  <path d="M-52 10 Q-60 -36 -30 -50 Q-44 -20 -40 14 Z" fill="#f1eee8"/><path d="M52 10 Q60 -36 30 -50 Q44 -20 40 14 Z" fill="#f1eee8"/>
  <path d="M-30 -46 Q0 -60 30 -46 Q0 -54 -30 -46Z" fill="#f1eee8"/>
  ${eyes('U','#2a2220')}
  <circle cx="-18" cy="6" r="14" fill="rgba(255,255,255,.14)" stroke="#3b3330" stroke-width="3"/><circle cx="18" cy="6" r="14" fill="rgba(255,255,255,.14)" stroke="#3b3330" stroke-width="3"/>
  <line x1="-4" y1="6" x2="4" y2="6" stroke="#3b3330" stroke-width="3"/>
  <path d="M-28 -14 L-8 -12" stroke="#f1eee8" stroke-width="7" stroke-linecap="round"/><path d="M8 -12 L28 -14" stroke="#f1eee8" stroke-width="7" stroke-linecap="round"/>
  <ellipse id="U-mo" cx="0" cy="34" rx="8" ry="6" fill="#6b2a2a"/>
  <path id="U-mc" d="M-9 34 Q0 39 9 34" stroke="#7a3a2a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M-22 26 Q0 14 22 26 Q12 32 0 28 Q-12 32 -22 26Z" fill="#f4f1ea"/>
  </g>`;
}
function cat(id){
  return `<g id="${id}">
   <path id="${id}-tail" d="M-56 6 Q-110 10 -100 -30" stroke="#d9802f" stroke-width="16" fill="none" stroke-linecap="round"/>
   <ellipse id="${id}-body" cx="0" cy="0" rx="64" ry="30" fill="#e58e3e"/>
   <path d="M-20 -26 Q-14 0 -22 26 M0 -30 Q6 0 0 30 M20 -27 Q26 0 20 27" stroke="#c46e25" stroke-width="7" fill="none"/>
   <circle cx="56" cy="-8" r="25" fill="#e58e3e"/>
   <path d="M38 -24 L42 -50 L58 -30 Z M60 -30 L76 -48 L78 -22 Z" fill="#e58e3e"/>
   <path d="M46 -8 Q51 -4 56 -8 M62 -8 Q67 -4 72 -8" stroke="#5a3010" stroke-width="3" fill="none"/>
   <circle cx="62" cy="2" r="3" fill="#c0505a"/></g>`;
}

/* ---------- scenes ---------- */
const S={};
S.room=function(){
  const r=rng(7);let city='',stars='';
  for(let i=0;i<16;i++){const bw=34+r()*46,bh=120+r()*300,x=550+i*32;city+=`<rect x="${x}" y="${770-bh}" width="${bw}" height="${bh}" fill="#171a3c"/>`;
    for(let yy=770-bh+14;yy<760;yy+=26)for(let xx=x+6;xx<x+bw-8;xx+=14)if(r()<.32)city+=`<rect x="${xx}" y="${yy}" width="6" height="10" fill="#ffd479" opacity="${.5+r()*.5}"/>`;}
  for(let i=0;i<34;i++)stars+=`<circle class="star" cx="${570+r()*450}" cy="${170+r()*300}" r="${1+r()*2.2}" fill="#fff" data-p="${r()*6}"/>`;
  let books='';const bc=['#c9563c','#e0a53a','#4f7fa8','#7a9a5a','#8a5aa0','#d9d0bb','#3f6a62'];
  for(let s=0;s<5;s++){let x=46;while(x<200){const w=14+r()*16,h=90+r()*40;books+=`<rect x="${x}" y="${386+s*150-h}" width="${w}" height="${h}" fill="${bc[Math.floor(r()*bc.length)]}"/>`;x+=w+3}}
  return `<svg viewBox="0 0 1080 1920"><defs>
   <linearGradient id="rg-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14183f"/><stop offset="1" stop-color="#3b2d6e"/></linearGradient>
   <linearGradient id="rg-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2148"/><stop offset="1" stop-color="#0f0c1e"/></linearGradient>
   <radialGradient id="rg-lamp" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/></radialGradient>
   <clipPath id="rc-win"><rect x="570" y="170" width="450" height="600"/></clipPath></defs>
   <g id="room-cam">
   <rect x="-800" y="-600" width="2700" height="1670" fill="#2c2550"/>
   <rect x="-800" y="1060" width="2700" height="1500" fill="url(#rg-floor)"/>
   <rect x="-800" y="1052" width="2700" height="10" fill="#3a3168"/>
   <rect x="560" y="160" width="470" height="620" fill="#3d3570"/>
   <g clip-path="url(#rc-win)"><rect x="570" y="170" width="450" height="600" fill="url(#rg-glass)"/>${stars}
     <path d="M940 250 A40 40 0 1 0 975 310 A32 32 0 1 1 940 250Z" fill="#f4ecd0"/>${city}</g>
   <rect x="792" y="170" width="6" height="600" fill="#3d3570"/>
   <path d="M530 150 L590 150 Q575 480 600 800 L530 800 Z" fill="#5b3f86"/><path d="M1060 150 L1000 150 Q1015 480 990 800 L1060 800 Z" fill="#5b3f86"/>
   <rect x="30" y="230" width="190" height="830" fill="#3a2a22"/><rect x="40" y="240" width="170" height="810" fill="#2a1e18"/>
   ${books}${[0,1,2,3,4].map(s=>`<rect x="40" y="${386+s*150}" width="170" height="10" fill="#3a2a22"/>`).join('')}
   <rect x="60" y="196" width="110" height="36" rx="6" fill="#121218"/><text x="115" y="223" font-size="24" fill="#59e08a" text-anchor="middle" font-family="Courier Prime">23:40</text>
   <rect x="296" y="290" width="130" height="130" fill="#c9a77a"/><rect x="306" y="300" width="110" height="110" fill="#f0dcc0"/><circle cx="361" cy="360" r="26" fill="#e07a4a"/>
   <line x1="560" y1="-600" x2="560" y2="590" stroke="#15122a" stroke-width="4"/>
   <path id="room-cone" d="M510 650 L610 650 L760 880 L360 880 Z" fill="url(#rg-lamp)"/>
   <path d="M520 592 L600 592 L626 652 L494 652 Z" fill="#e8c071"/><ellipse cx="560" cy="652" rx="66" ry="8" fill="#ffe9b0"/>
   <ellipse cx="560" cy="1112" rx="430" ry="62" fill="#5e2b63"/><ellipse cx="560" cy="1112" rx="390" ry="48" fill="none" stroke="#7a3f80" stroke-width="4"/>
   <g transform="translate(560 1085)">${cat('rcat')}</g>
   <g transform="translate(240 620) scale(1.3)">${uncle()}</g>
   <rect x="420" y="858" width="290" height="20" rx="4" fill="#8a5a3c"/><rect x="440" y="878" width="16" height="182" fill="#6a4430"/><rect x="674" y="878" width="16" height="182" fill="#6a4430"/>
   <path d="M470 858 Q470 818 505 818 Q540 818 540 858 Z" fill="#c4553a"/><rect x="497" y="806" width="16" height="14" fill="#c4553a"/><path d="M540 838 L566 826" stroke="#c4553a" stroke-width="7"/>
   <rect x="600" y="850" width="96" height="8" fill="#9aa0aa"/><path d="M696 856 L712 782" stroke="#5c6270" stroke-width="10" stroke-linecap="round"/>
   <g transform="translate(860 600) scale(1.3)">${nephew()}</g>
   </g></svg>`;
};
S.london=function(){
  const r=rng(3);let b='';
  for(let i=0;i<12;i++){const x=i*95-20,h=200+r()*260;b+=`<rect x="${x}" y="${1060-h}" width="${90}" height="${h}" fill="${i%2?'#3e3125':'#46382a'}"/>`;
    for(let yy=1060-h+20;yy<1040;yy+=40)for(let xx=x+12;xx<x+80;xx+=26)if(r()<.25)b+=`<rect x="${xx}" y="${yy}" width="10" height="16" fill="#c99a52" opacity=".55"/>`;}
  const ch=[140,330,640,900];let c='';ch.forEach((x,i)=>c+=`<rect x="${x}" y="${470+i%2*60}" width="46" height="600" fill="#33281e"/><rect x="${x-6}" y="${470+i%2*60}" width="58" height="16" fill="#2a2018"/>`);
  let p='';for(let i=0;i<32;i++)p+=`<circle class="puff" data-c="${i%4}" data-i="${i}" r="40" fill="#6b5a48"/>`;
  return `<svg viewBox="0 0 1080 1920"><defs><linearGradient id="lg-l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a805c"/><stop offset="1" stop-color="#5e4a37"/></linearGradient></defs>
  <g class="art"><rect width="1080" height="1920" fill="url(#lg-l)"/>
  <circle cx="780" cy="330" r="90" fill="#f3d9a0" opacity=".28"/>
  ${c}<g id="lon-smoke">${p}</g>${b}
  <rect y="1060" width="1080" height="860" fill="#2d241b"/><rect y="1060" width="1080" height="14" fill="#3d3124"/>
  <g id="lon-kid"><g transform="scale(2.4)">
    <path d="M-12 40 Q-30 66 -12 92" stroke="#3a2e24" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M12 40 Q30 66 12 92" stroke="#3a2e24" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="-14" cy="96" rx="10" ry="5" fill="#1d1712"/><ellipse cx="14" cy="96" rx="10" ry="5" fill="#1d1712"/>
    <path d="M-22 0 L22 0 L26 46 L-26 46 Z" fill="#6a5440"/>
    <path d="M-20 4 L-30 38 M20 4 L30 38" stroke="#6a5440" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="-20" r="20" fill="#d9b08c"/><path d="M-22 -26 Q0 -48 22 -26 L26 -24 L-22 -24Z" fill="#4a3a2c"/>
    <circle cx="-7" cy="-17" r="2.4" fill="#2a2018"/><circle cx="7" cy="-17" r="2.4" fill="#2a2018"/><path d="M-5 -6 Q0 -9 5 -6" stroke="#5a3a2a" stroke-width="2" fill="none"/>
  </g></g></g></svg>
  ${year('อังกฤษ','1800s')}
  <div class="card" data-at="2.8" style="right:50px;top:300px;width:380px"><div class="k">Rickets</div><h3>โรคกระดูกอ่อน</h3>
   <div class="row"><span>กระดูกนิ่ม</span><span class="no">●</span></div><div class="row"><span>ขาโก่ง</span><span class="no">●</span></div><div class="row"><span>ตัวเตี้ย แคระแกร็น</span><span class="no">●</span></div></div>`;
};
S.cmp=function(){

  at('.puff',L.london.el).forEach(p=>{const i=+p.dataset.i,c=ch[+p.dataset.c],ph=(lt*.11+i/8)%1;
   p.setAttribute('cx',c[0]+ph*240+Math.sin(ph*6+i)*20);p.setAttribute('cy',c[1]-ph*430);p.setAttribute('r',28+ph*80);p.setAttribute('opacity',.6*(1-ph)*clamp(ph*6))});
  const x=260+lt*55;$('lon-kid').setAttribute('transform',`translate(${x} ${828-Math.abs(Math.sin(lt*4))*6})`);
 },
 cmp(lt){
  $('cmp-rays').setAttribute('transform',`rotate(${lt*12})`);
  $('cmp-kid2').setAttribute('transform',`translate(810 ${870-Math.abs(Math.sin(lt*4.5))*40})`);
  at('.cpuff',L.cmp.el).forEach(p=>{const i=+p.dataset.i,c=i%2?[350,470]:[120,420],ph=(lt*.12+i/7)%1;
   p.setAttribute('cx',c[0]+ph*160);p.setAttribute('cy',c[1]-ph*360);p.setAttribute('r',26+ph*70);p.setAttribute('opacity',.7*(1-ph))});
 },
 dog(lt){
  const h=ease((lt-M(11)+0.2)/0.5);$('dog-sad').setAttribute('opacity',1-h);$('dog-happy').setAttribute('opacity',h);
  $('dog-tail').setAttribute('transform',`rotate(${Math.sin(lt*14)*18} -104 0)`);
 },
 uv(lt){
  $('uv-cone').setAttribute('opacity',.22+Math.sin(lt*7)*.05);
  $('uv-b1').setAttribute('opacity',.2+.8*ease((lt-M(13))/2.0));
 },
 mcc(lt){
  const f=1+Math.sin(lt*23)*.08+Math.sin(lt*37)*.05;$('mcc-flame').setAttribute('transform',`translate(0 -110) scale(1 ${f}) translate(0 110)`);
  at('.bub',L.mcc.el).forEach(b=>{const i=+b.dataset.i,ph=(lt*.9+i*.37)%1;b.setAttribute('cx',-100+i*25);b.setAttribute('cy',4-ph*10);b.setAttribute('r',3+ph*7);b.setAttribute('opacity',1-ph)});
  $('mcc-steam').setAttribute('transform',`translate(0 ${-((lt*20)%30)})`);
  const s=back((lt-M(18)-0.5)/0.5);$('mcc-d').setAttribute('transform',`translate(720 1010) scale(${Math.max(.01,s)}) translate(-720 -1010)`);
  $('mcc-spk').setAttribute('opacity',.5+.5*Math.sin(lt*8));
 },
 steen(lt){
  at('.sray',L.steen.el).forEach((r,i)=>r.setAttribute('stroke-dashoffset',-lt*120-i*9));
  const press=Math.max(0,Math.sin(lt*Math.PI*2/1.4))**6;$('st-press').setAttribute('height',40+press*30);
  at('.milk',L.steen.el).forEach(m=>{const i=+m.dataset.i;let x=((lt*130+i*180)%1260)-120;m.setAttribute('transform',`translate(${x} 1000)`);
   m.querySelector('.milk-lbl').setAttribute('opacity',x>690?1:0)});
 },
 trend(lt){const p=$('tr-line'),len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len*(1-ease((lt-.5)/2.6))},
 skin(lt){
  $('sk-rays').setAttribute('transform',`rotate(${lt*10})`);
  at('.beam',L.skin.el).forEach(b=>b.setAttribute('stroke-dashoffset',-lt*140));
  const p=ease((lt-M(23))/1.4);$('sk-d3').setAttribute('transform',`translate(${660} ${730-p*240}) scale(${Math.max(.01,p)})`);
  $('sk-mol').setAttribute('opacity',1-p*.6);
 },
 path(lt){
  const p=ease((lt-.6)/(CURD-1.8)),line=$('pa-line'),len=line.getTotalLength();line.style.strokeDasharray=len;line.style.strokeDashoffset=len*(1-p);
  const pt=line.getPointAtLength(len*p);$('pa-dot').setAttribute('cx',pt.x);$('pa-dot').setAttribute('cy',pt.y);
  [0,1/3,2/3,1].forEach((th,i)=>{const on=p>=th-.001;const ring=$('pa'+i).querySelector('.ring');ring.setAttribute('stroke',on?'#ffcf4a':'#4a4670');$('pa'+i).setAttribute('opacity',on?1:.45)});
 },
 sheep(lt){$('sh-sheep').setAttribute('transform',`translate(330 ${820-Math.abs(Math.sin(lt*3))*14})`)},
 thai(lt){const n=Math.round(45*ease((lt-.8)/2.2));at('#th-grid i',L.thai.el).forEach((e,i)=>e.className=i<n?'on':'');$('th-bar').style.width=(64.6*ease((lt-M(30))/1.2))+'%'},
 tip(lt){$('tip-s').style.setProperty('--w',(110*ease((lt-1.0)/.6))+'%')},
 next(){},end(lt){$('end-rays').setAttribute('transform',`rotate(${lt*8})`)}
};

const FADE=.45;
window.seek=function(t){
  for(const k in L){L[k].el.style.opacity=0;L[k].el.style.zIndex=0}
  TL.forEach((e,idx)=>{const [k,a,b,o]=e;if(t<a||t>=b+FADE||(t>=b&&idx==TL.length-1))return;
    const nxt=TL[idx+1];if(t>=b&&nxt&&nxt[0]==k)return;
    const Ly=L[k],lt=t-a;CURA=a;CURD=b-a;Ly.el.style.opacity=a==0?1:ease((t-a)/FADE);Ly.el.style.zIndex=10+idx;
    if(Ly.art&&k!=='room')Ly.art.style.transform=`scale(${1+lt*0.008})`;
    Ly.pops.forEach(p=>{const pa=p.dataset.sub?SUBS[+p.dataset.sub][0]-a+(+p.dataset.off||0):+p.dataset.at,e2=ease((lt-pa)/.45);p.style.opacity=e2;
      const base=p.classList.contains('chip')&&p.style.left=='50%'?'translateX(-50%) ':'';
      if(!p.classList.contains('src'))p.style.transform=base+`translateY(${(1-e2)*26}px)`;});
    U[k](lt,t,o||{});
  });
  SUBS.forEach((s,i)=>{const el=$('sub'+i);const o=clamp((t-s[0])/.2)*clamp((s[1]-t)/.15);el.style.opacity=o;el.style.transform=`translateY(${(1-clamp((t-s[0])/.25))*18}px)`});
  $('black').style.opacity=clamp((t-(DUR-1.0))/1.0)+ (t<0.35?1-t/0.35:0);
};
window.DUR=DUR;
seek(0);
</script></body></html>
