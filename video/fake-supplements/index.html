<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#07070b;font-family:'Prompt',sans-serif;color:#f4f1ea}
#world{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;overflow:hidden}
.scene>svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
.art{transform-origin:0 0}
#subs{position:absolute;left:0;right:0;top:1290px;height:420px;z-index:500}
.sub{position:absolute;left:40px;right:40px;top:0;text-align:center;opacity:0}
.th{font-weight:700;font-size:66px;line-height:1.32;color:#fff;text-shadow:0 0 2px #000,0 5px 0 rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.9)}
.th b,.th r{display:inline-block;font-weight:700}
.th b{color:#ffd23a}
.th r{color:#fff;background:#e0162b;padding:0 14px;border-radius:8px;text-shadow:none}
.ev{position:absolute;background:#f4f1ea;color:#111;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6);padding:22px 28px;border-left:10px solid #e0162b}
.ev .k{font-size:20px;letter-spacing:2px;color:#7a7484;font-weight:600;text-transform:uppercase}
.ev h3{margin:2px 0 0;font-size:40px;line-height:1.25}
.ev .n{font-family:'Courier Prime',monospace;font-weight:700;font-size:78px;line-height:1.05;color:#e0162b}
.ev .row{display:flex;justify-content:space-between;gap:20px;font-size:30px;padding:10px 0;border-top:2px solid #ddd6c8}
.chip{position:absolute;font-size:28px;font-weight:600;padding:6px 20px;border-radius:999px;white-space:nowrap}
.red{background:#e0162b;color:#fff}.ylw{background:#ffd23a;color:#111}.drk{background:rgba(0,0,0,.7);color:#f4f1ea;border:2px solid #3a3a48}
.src{position:absolute;right:36px;top:54px;font-size:19px;color:#cfc9d8;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:8px;max-width:640px;text-align:right}
.src b{color:#ffd23a;font-size:15px;letter-spacing:2px;margin-right:8px}
.stamp{position:absolute;font-weight:700;color:#e0162b;border:6px solid #e0162b;border-radius:12px;padding:4px 22px;font-size:46px;transform:rotate(-8deg);background:rgba(244,241,234,.06)}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:700;line-height:1.15}
#grain{position:absolute;inset:0;z-index:400;opacity:.09;pointer-events:none;mix-blend-mode:overlay}
#scan{position:absolute;inset:0;z-index:401;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px);opacity:.35}
#vig{position:absolute;inset:0;z-index:402;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 50%,rgba(0,0,0,.75) 100%)}
#flash{position:absolute;inset:0;z-index:450;background:#fff;opacity:0;mix-blend-mode:overlay}
#black{position:absolute;inset:0;z-index:600;background:#000;opacity:0}
</style></head>
<body>
<div id="stage"><div id="world"></div>
  <div id="grain"></div><div id="scan"></div><div id="vig"></div><div id="flash"></div>
  <div id="subs"></div><div id="black"></div>
</div>
<script src="timeline.js"></script>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const src=s=>`<div class="src" data-at="0.3"><b>SOURCE</b>${s}</div>`;
const RED='#e0162b',YLW='#ffd23a',GRN='#b6ff3b',INK='#07070b';

const SUBS=[
'เธอกดสั่งจาก<b>ร้านออนไลน์</b>','อาหารเสริมลดน้ำหนัก <b>ราคาถูก ส่งไว</b>','หลังจากนั้น… <r>เธอเสียชีวิต</r>',
'ในนั้น มี<r>สารที่ถูกแบน</r>ในหลายประเทศ','นี่คือเส้นทางของ<b>อาหารเสริมเถื่อน</b>','จาก<b>ด่านสนามบิน</b>','สู่<b>โกดังล้านชิ้น</b>',
'ผ่าน<r>เลข อย. ที่ขโมยมา</r>','จนถึง<b>มือคุณ</b>','และหลายคดี มี<r>ทุนจีน</r>อยู่เบื้องหลัง',
'ครึ่งปี ด่านสนามบิน-ไปรษณีย์ สกัดได้<br><b>3,975 รายการ</b> กว่า <b>51 ล้านบาท</b>','<b>ปากกาลดน้ำหนัก</b> · ฟิลเลอร์ · ยาเพิ่มสมรรถภาพ',
'ไปจนถึง <r>เฟนทานิล</r>','เทคนิค: <b>นำเข้าทีละน้อย แต่ถี่</b>','31 ต.ค. ชายชาวจีน<br><r>ถูกจับที่สุวรรณภูมิ</r>',
'ในกระเป๋า: ปากกาลดน้ำหนักเถื่อน<br><b>8,900 ด้าม</b>','แต่ของบางส่วน <b>ไม่ได้มาทางอากาศ</b>','มันมา<b>ทางบก</b> ผ่านอีสาน เข้ากรุงเทพฯ',
'โกดังหนองแขม: แบรนด์ดังปลอม<br><b>กว่า 26,000 ชิ้น</b>','ตำรวจระบุ เจ้าของเป็น<r>ชายชาวจีน</r>','แต่ที่<b>บางบ่อ</b> สมุทรปราการ<br>ใหญ่กว่านั้นมาก',
'<r>1,073,327 ชิ้น</r>','กาแฟ · มัทฉะ · อาหารเสริมผิว<br><b>ขายว่อนออนไลน์</b>','ทำไมคนถึงเชื่อ?<br>เพราะฉลาก<b>มีเลข อย.</b>',
'แต่เป็น<r>เลขของสินค้าอื่น</r><br>ที่ถูกเอามาแปะ','ลาดกระบัง: ขาย<b>วันละ 3,000 ชิ้น</b><br>นานกว่า 1 ปี',
'บางที มันวางอยู่บนชั้น<br><b>ซูเปอร์มาร์เก็ตกลางเมือง</b>','ร้านนำเข้าจากจีน 47 แห่ง<br>ยึด <r>94,476 ชิ้น</r>','แล้ว<b>ในแคปซูล</b> มีอะไร?',
'<r>ไซบูทรามีน</r><br>ถูกถอนจากตลาดตั้งแต่ปี 2010','เพิ่มเสี่ยง<r>หัวใจวาย</r><br>และ<r>เส้นเลือดในสมอง</r>','ในไทย: <r>วัตถุออกฤทธิ์ประเภท 1</r>',
'ตำรวจตามรอยจาก<b>พัสดุตีกลับ</b><br>ในสกลนคร','ค้น 4 จุด · ยึด <b>18 กระปุก</b>','แต่อย่าคิดว่า… มีแค่<b>ทุนต่างชาติ</b>',
'แบรนด์ดังของไทยเอง ผสมไซบูทรามีน<br>ถูกยึด <r>กว่า 16 ล้านบาท</r>','',
'ตรวจเลข อย. ก่อนซื้อ<br><b>แอป Oryor</b> · โทร <b>1556</b>','<r>ถูกเกินจริง</r> <r>เห็นผลไวเกินจริง</r><br>= สัญญาณอันตราย','เลข อย. ตรวจได้ใน<b>10 วินาที</b>',''];

/* ---------- helpers ---------- */
function phone(inner,id=''){return `<g ${id?`id="${id}"`:''}><rect x="-262" y="-482" width="524" height="964" rx="64" fill="#1b1b24" stroke="#33333f" stroke-width="6"/>
  <rect x="-238" y="-456" width="476" height="912" rx="44" fill="#f6f3ee"/>${inner}<rect x="-60" y="-446" width="120" height="22" rx="11" fill="#1b1b24"/></g>`}
function box(x,y,w,h,c='#9a6a3c',label=''){return `<g transform="translate(${x} ${y})"><rect width="${w}" height="${h}" fill="${c}"/><rect y="${h*.42}" width="${w}" height="${h*.16}" fill="rgba(0,0,0,.18)"/><rect width="${w}" height="${h}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3"/>${label?`<text x="${w/2}" y="${h*.36}" font-size="${Math.min(w,h)*.2}" font-weight="700" fill="rgba(0,0,0,.55)" text-anchor="middle">${label}</text>`:''}</g>`}
function capsule(r=1,c1=RED,c2='#f4f1ea'){return `<g transform="scale(${r})"><rect x="-150" y="-62" width="300" height="124" rx="62" fill="${c2}"/><path d="M0 -62 L88 -62 A62 62 0 0 1 88 62 L0 62Z" fill="${c1}"/><rect x="-120" y="-44" width="90" height="16" rx="8" fill="rgba(255,255,255,.55)"/></g>`}
function ecgPath(x0,x1,y,beats,amp){let d=`M${x0} ${y}`;const w=(x1-x0)/beats;for(let i=0;i<beats;i++){const b=x0+i*w;d+=` L${b+w*.35} ${y} L${b+w*.42} ${y-amp*.2} L${b+w*.48} ${y+amp*.25} L${b+w*.53} ${y-amp} L${b+w*.6} ${y+amp*.5} L${b+w*.66} ${y} L${b+w} ${y}`}return d}

/* ---------- scenes ---------- */
const S={};
S.open=function(){
  const ui=`<rect x="-238" y="-456" width="476" height="96" rx="44" fill="#111"/><rect x="-238" y="-400" width="476" height="40" fill="#111"/>
   <rect x="-200" y="-420" width="110" height="34" rx="17" fill="${RED}"/><text x="-145" y="-395" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">LIVE</text>
   <text x="60" y="-394" font-size="26" font-weight="600" fill="#fff" text-anchor="middle">ร้านค้าออนไลน์</text>
   <rect x="-200" y="-330" width="400" height="330" rx="20" fill="#ffe3dc"/>
   <rect x="-80" y="-300" width="160" height="40" rx="10" fill="#c93a58"/><rect x="-70" y="-266" width="140" height="200" rx="26" fill="#ff6b8b"/>
   <text x="0" y="-172" font-size="44" font-weight="700" fill="#fff" text-anchor="middle">SLIM</text><text x="0" y="-134" font-size="22" font-weight="600" fill="#fff" text-anchor="middle">7 DAYS</text>
   <rect x="110" y="-320" width="80" height="80" rx="40" fill="${YLW}"/><text x="150" y="-272" font-size="22" font-weight="700" fill="#111" text-anchor="middle">-78%</text>
   <text x="-200" y="50" font-size="34" font-weight="700" fill="#111">ลดไว 7 วัน เห็นผลจริง!</text>
   <text x="-200" y="140" font-size="70" font-weight="700" fill="${RED}">฿199</text><text x="10" y="134" font-size="34" fill="#999">฿890</text><line x1="6" y1="122" x2="92" y2="122" stroke="#999" stroke-width="3"/>
   <text x="200" y="134" font-size="24" fill="#666" text-anchor="end">ขายแล้ว 10K+</text>
   <rect id="op-btn" x="-200" y="190" width="400" height="96" rx="48" fill="${RED}"/><text x="0" y="252" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">สั่งซื้อเลย</text>
   <circle id="op-tap" cx="0" cy="238" r="0" fill="none" stroke="#fff" stroke-width="8"/>
   <text x="-200" y="350" font-size="24" fill="#888">เลข อย.:</text><text id="op-fda" x="-104" y="350" font-size="24" font-weight="700" fill="#888">—</text>
   <line id="op-ul" x1="-204" y1="362" x2="-204" y2="362" stroke="${RED}" stroke-width="6" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 1080 1920"><defs><radialGradient id="op-bg" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#1d1626"/><stop offset="1" stop-color="#050507"/></radialGradient></defs>
  <g class="art"><rect x="-500" y="-500" width="2100" height="2900" fill="url(#op-bg)"/>
   <g transform="translate(540 640)">${phone(ui)}</g>
   <g id="op-box" opacity="0"><g transform="translate(400 920)"><rect width="280" height="190" fill="#b07a46"/><rect x="0" y="0" width="280" height="40" fill="#9a6838"/><rect x="120" y="0" width="40" height="190" fill="#d9c08a" opacity=".7"/>
     <rect x="30" y="80" width="140" height="80" fill="#f4f1ea"/><text x="100" y="128" font-size="24" font-weight="700" fill="#333" text-anchor="middle">พัสดุ</text></g></g>
   <rect id="op-dim" x="-500" y="-500" width="2100" height="2900" fill="#000" opacity="0"/>
   <path id="op-ecg" d="${ecgPath(-40,700,640,4,170)} L1120 640" fill="none" stroke="${GRN}" stroke-width="7" stroke-linejoin="round" opacity="0"/>
  </g></svg>`;
};
S.montage=function(){
  const r=rng(5);let boxes='';for(let i=0;i<7;i++)for(let j=0;j<6;j++)boxes+=box(140+i*115,380+j*105,108,98,['#9a6a3c','#8a5e34','#a8743f'][Math.floor(r()*3)]);
  const icons=['M-40 0 L40 0 M0 -40 L0 40','','',''];
  return `<svg viewBox="0 0 1080 1920"><g class="art"><rect x="-500" y="-500" width="2100" height="2900" fill="${INK}"/>
   <g id="mo-p0"><path d="M160 700 L400 700 L680 700 L920 700" stroke="${RED}" stroke-width="6" stroke-dasharray="16 14"/>
    ${[['ด่าน',160],['โกดัง',400],['เลข อย.',680],['มือคุณ',920]].map(([l,x],i)=>`<g transform="translate(${x} 700)"><circle r="70" fill="#15151d" stroke="${i==3?RED:'#44445a'}" stroke-width="6"/><text y="12" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">${l}</text></g>`).join('')}
    <circle id="mo-dot" r="16" fill="${YLW}"/></g>
   <g id="mo-p1"><path d="M240 760 L840 600 L880 640 L560 760 L600 900 L560 910 L470 790 L300 830 L280 880 L250 885 L250 800Z" fill="#e8e4f0"/>
    <rect id="mo-scan" x="0" y="560" width="1080" height="10" fill="${GRN}" opacity=".8"/></g>
   <g id="mo-p2">${boxes}</g>
   <g id="mo-p3"><rect x="190" y="520" width="700" height="330" rx="24" fill="#f4f1ea"/><text x="540" y="610" font-size="44" font-weight="700" fill="#111" text-anchor="middle">เลขสารบบอาหาร (เลข อย.)</text>
    <text id="mo-num" x="540" y="730" font-size="64" font-weight="700" fill="#111" text-anchor="middle" font-family="Courier Prime">00-0-00000-0-0000</text>
    <g transform="translate(720 820) rotate(-10)"><rect x="-120" y="-50" width="240" height="90" rx="12" fill="none" stroke="${RED}" stroke-width="8"/><text y="22" font-size="56" font-weight="700" fill="${RED}" text-anchor="middle">FAKE</text></g></g>
   <g id="mo-p4"><circle cx="540" cy="700" r="260" fill="${RED}" opacity=".12"/><g transform="translate(540 700) rotate(-25)">${capsule(1.6)}</g></g>
  </g></svg>`;
};
S.title=function(){
  const t=(c,dx,dy)=>`<g transform="translate(${dx} ${dy})" class="ti-${c}"><text x="540" y="640" font-size="120" font-weight="700" fill="${c=='w'?'#f4f1ea':c=='r'?'#ff2d55':'#2de0ff'}" text-anchor="middle">อาหารเสริม</text>
    <text x="540" y="860" font-size="230" font-weight="700" fill="${c=='w'?RED:c=='r'?'#ff2d55':'#2de0ff'}" text-anchor="middle">เถื่อน</text></g>`;
  return `<svg viewBox="0 0 1080 1920"><g class="art"><rect x="-500" y="-500" width="2100" height="2900" fill="#050507"/>
   <g opacity=".7" style="mix-blend-mode:screen"><g id="ti-r">${t('r',0,0)}</g><g id="ti-c">${t('c',0,0)}</g></g><g id="ti-w">${t('w',0,0)}</g>
   <rect x="300" y="920" width="480" height="6" fill="${RED}"/><text x="540" y="1000" font-size="44" font-weight="600" fill="#cfc9d8" text-anchor="middle" letter-spacing="6">เส้นทางมรณะ</text>
   <rect id="ti-bar" x="0" y="0" width="1080" height="40" fill="#fff" opacity="0"/></g></svg>`;
};
S.chapter=function(){
  return `<svg viewBox="0 0 1080 1920"><g class="art"><rect x="-500" y="-500" width="2100" height="2900" fill="#050507"/>
   <text id="ch-num" x="540" y="760" font-size="300" font-weight="700" fill="none" stroke="${RED}" stroke-width="6" text-anchor="middle" font-family="Courier Prime">01</text>
   <rect id="ch-bar" x="190" y="820" width="700" height="10" fill="${RED}"/>
   <text x="540" y="900" font-size="40" font-weight="600" fill="#8b8796" text-anchor="middle" letter-spacing="10">มุมที่</text>
   <text id="ch-title" x="540" y="1030" font-size="110" font-weight="700" fill="#fff" text-anchor="middle">ด่าน</text></g></svg>`;
};
S.airport=function(){
  let pens='';for(let r=0;r<5;r++)for(let c=0;c<9;c++)pens+=`<rect x="${370+c*38}" y="${290+r*32}" width="28" height="12" rx="6" fill="${c%3?'#ff9a3c':'#2de0ff'}" opacity=".9"/>`;
  let rol='';for(let i=0;i<13;i++)rol+=`<circle cx="${i*90}" cy="870" r="16" fill="#2a2a34" stroke="#111" stroke-width="4"/>`;
  return `<svg viewBox="0 0 1080 1920"><g class="art"><rect x="-500" y="-500" width="2100" height="2900" fill="#0c0d14"/>
   <rect x="250" y="200" width="580" height="320" rx="16" fill="#111522" stroke="#2c3348" stroke-width="8"/><rect x="270" y="220" width="540" height="280" fill="#061226"/>
   <g id="ap-xr" opacity="0"><rect x="340" y="260" width="400" height="210" rx="20" fill="none" stroke="#2de0ff" stroke-width="5"/>${pens}</g>
   <rect id="ap-scan" x="270" y="220" width="8" height="280" fill="${GRN}"/>
   <g id="ap-alert" opacity="0"><rect x="430" y="440" width="220" height="50" rx="8" fill="${RED}"/><text x="540" y="477" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">ALERT</text></g>

   ${Array.from({length:12},(_,i)=>`<rect x="${255+i*48}" y="600" width="40" height="250" fill="#22252f" opacity=".85"/>`).join('')}
   <rect x="-200" y="850" width="1480" height="40" fill="#1d1f27"/>${rol}
   <g id="ap-bag"><rect x="-130" y="-130" width="260" height="130" rx="16" fill="#2b4a8a"/><rect x="-40" y="-160" width="80" height="34" rx="10" fill="none" stroke="#1b3060" stroke-width="10"/></g></g></svg>
  ${src('อย.–กรมศุลกากร · ผลงาน 6 เดือนปีงบ 2569')}
  <div class="ev" data-at="1" data-sub="10" data-off="0.3" style="left:60px;right:60px;top:930px"><div class="k">ต.ค. 68 – มี.ค. 69 · สุวรรณภูมิ · ดอนเมือง · ไปรษณีย์หลักสี่</div>
   <div style="display:flex;align-items:flex-end;justify-content:space-between"><div class="n">3,975</div><div style="font-size:34px;font-weight:700">รายการ · <span style="color:${RED}">51 ล้าน+</span></div></div></div>
  <div class="chip ylw" data-at="2" data-sub="11" style="left:60px;top:1150px">ปากกาลดน้ำหนัก</div><div class="chip ylw" data-at="2.2" data-sub="11" data-off="0.7" style="left:350px;top:1150px">ฟิลเลอร์</div>
  <div class="chip ylw" data-at="2.4" data-sub="11" data-off="1.3" style="left:520px;top:1150px">ยาเพิ่มสมรรถภาพ</div>
  <div class="chip red" data-at="3" data-sub="12" data-off="0.3" style="left:60px;top:1210px">เฟนทานิล · แรงกว่ามอร์ฟีน ~100 เท่า</div>`;
};
S.trick=function(){
  let small='';for(let i=0;i<16;i++)small+=`<g class="tr-s" data-i="${i}">${box(-30,-30,60,60,'#a8743f')}</g>`;
  return `<svg viewBox="0 0 1080 1920"><g class="art"><rect x="-500" y="-500" width="2100" height="2900" fill="#0c0d14"/>
   <rect x="-200" y="760" width="1480" height="16" fill="#2a2a34"/>
