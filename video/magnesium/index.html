<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#07070b;font-family:'Prompt',sans-serif;color:#f4f1ea}
#world{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;overflow:hidden}
.scene>svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
.art{transform-origin:0 0}
#subs{position:absolute;left:0;right:0;top:1290px;height:420px;z-index:500}
.sub{position:absolute;left:40px;right:40px;top:0;text-align:center;opacity:0}
.tag{display:inline-block;font-size:28px;font-weight:600;padding:2px 18px;border-radius:999px;margin-bottom:10px;letter-spacing:1px}
.tag.u{background:#d9a53a;color:#2a1d08}.tag.n{background:#5fb3e0;color:#08202c}
.kc{display:inline-block;transform-origin:50% 80%}
.year{position:absolute;left:50px;top:90px;background:#efe6d2;border-radius:10px;padding:14px 26px 12px 22px;box-shadow:0 12px 30px rgba(0,0,0,.45);border-left:8px solid #c9a24a;color:#2b261f}
.year .yk{font-size:26px;font-weight:600}.year .yv{font-family:"Courier Prime",monospace;font-size:66px;line-height:1;margin-top:4px}.year .yv small{font-family:Prompt;font-size:28px;font-weight:600;margin-right:8px}
.th{font-weight:700;font-size:66px;line-height:1.32;color:#fff;text-shadow:0 0 2px #000,0 5px 0 rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.9)}
.th b,.th r{display:inline-block;font-weight:700}
.th b{color:#ffd23a}
.th r{color:#fff;background:#e0162b;padding:0 14px;border-radius:8px;text-shadow:none}
.ev{position:absolute;background:#f4f1ea;color:#111;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6);padding:22px 28px;border-left:10px solid #e0162b}
.ev .k{font-size:20px;letter-spacing:2px;color:#7a7484;font-weight:600;text-transform:uppercase}
.ev h3{margin:2px 0 0;font-size:40px;line-height:1.25}
.ev .n{font-family:'Courier Prime',monospace;font-weight:700;font-size:78px;line-height:1.05;color:#e0162b}
.ev .row{display:flex;justify-content:space-between;gap:20px;font-size:30px;padding:10px 0;border-top:2px solid #ddd6c8}
.chip{position:absolute;font-size:28px;font-weight:600;padding:6px 20px;border-radius:999px;white-space:nowrap}
.red{background:#e0162b;color:#fff}.ylw{background:#ffd23a;color:#111}.drk{background:rgba(0,0,0,.7);color:#f4f1ea;border:2px solid #3a3a48}
.src{position:absolute;right:36px;top:54px;font-size:19px;color:#cfc9d8;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:8px;max-width:640px;text-align:right}
.src b{color:#ffd23a;font-size:15px;letter-spacing:2px;margin-right:8px}
.stamp{position:absolute;font-weight:700;color:#e0162b;border:6px solid #e0162b;border-radius:12px;padding:4px 22px;font-size:46px;transform:rotate(-8deg);background:rgba(244,241,234,.06)}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:700;line-height:1.15}
#grain{position:absolute;inset:0;z-index:400;opacity:.09;pointer-events:none;mix-blend-mode:overlay}
#scan{position:absolute;inset:0;z-index:401;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px);opacity:.35}
#vig{position:absolute;inset:0;z-index:402;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 50%,rgba(0,0,0,.75) 100%)}
#flash{position:absolute;inset:0;z-index:450;background:#fff;opacity:0;mix-blend-mode:overlay}
#black{position:absolute;inset:0;z-index:600;background:#000;opacity:0}
</style></head>
<body>
<div id="stage"><div id="world"></div>
  <div id="grain"></div><div id="scan"></div><div id="vig"></div><div id="flash"></div>
  <div id="subs"></div><div id="black"></div>
</div>
<script src="timeline.js"></script>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const src=s=>`<div class="src" data-at="0.3"><b>SOURCE</b>${s}</div>`;
const RED='#e0162b',YLW='#ffd23a',GRN='#b6ff3b',INK='#07070b';

const SUBS=['โอ๊ยยย!|<r>ตะคริว</r>|กินน่อง!','ลุง!|<b>แมกนีเซียม</b>|อยู่ไหน','กินไป…|ก็<r>แทบไม่ช่วย</r>|หรอก','แต่มี<b>อยู่ที่เดียว</b>|<br>ที่มัน<b>ช่วยชีวิตคน</b>|ได้จริง','และเรื่องนี้|เริ่มจาก<b>วัว</b>|ที่<r>ไม่ยอมกินน้ำ</r>','ปี 1618|ที่<b>เอปซัม</b> อังกฤษ|แล้งหนัก','ชาวนาเจอบ่อน้ำ|แต่วัวไม่ยอมกิน|<br>เพราะมัน<r>ขมปี๋</r>','คนลองดื่มเอง…|<br>แล้วก็ต้อง<b>วิ่งเข้าห้องน้ำ</b>','เกลือในน้ำนั้น|<br>กลายเป็น<b>ยาระบาย</b>|ดังทั้งยุโรป','<b>ดีเกลือฝรั่ง</b>|นี่เอง!','ใช่…|ข้างในคือ<b>แมกนีเซียม</b>','ตะคริวในผู้สูงอายุ|<br>กินแล้ว<r>แทบไม่ต่าง</r>|จากยาหลอก','นอนไม่หลับ: หลับไวขึ้นแค่|<b>~17 นาที</b>|<br>หลักฐาน<r>ยังอ่อน</r>','กินแล้ว<r>ท้องเสีย</r>?|<br>อาจเป็นชนิด<b>ออกไซด์</b>','ดูดซึมน้อย…|<br>ที่เหลือก็เหมือน<b>ดีเกลือ</b>','แล้วที่<b>ช่วยชีวิตคน</b>|ได้จริงล่ะ?','ในห้องคลอด|แม่<r>ครรภ์เป็นพิษ</r>|<br>เสี่ยง<r>ชัก</r>ถึงขั้นเสียชีวิต','ทดลองกับแม่ <b>1 หมื่นคน</b>|<br>แมกนีเซียม|<b>ลดการชักได้ครึ่งหนึ่ง</b>','','กินเสริม ไม่เกิน|<b>350 มก./วัน</b>|<br><r>โรคไต</r> ถามหมอก่อน','หรือกิน|<b>ถั่ว</b> ·|<b>เมล็ดฟักทอง</b> ·|<b>ผักใบเขียว</b>','แล้ว<r>ตะคริว</r>|ผมล่ะลุง!','ลุกขึ้น…|<b>ยืดน่อง</b>ซะ',''];


/* ---------- helpers ---------- */
function phone(inner,id=''){return `<g ${id?`id="${id}"`:''}><rect x="-262" y="-482" width="524" height="964" rx="64" fill="#1b1b24" stroke="#33333f" stroke-width="6"/>
  <rect x="-238" y="-456" width="476" height="912" rx="44" fill="#f6f3ee"/>${inner}<rect x="-60" y="-446" width="120" height="22" rx="11" fill="#1b1b24"/></g>`}
function box(x,y,w,h,c='#9a6a3c',label=''){return `<g transform="translate(${x} ${y})"><rect width="${w}" height="${h}" fill="${c}"/><rect y="${h*.42}" width="${w}" height="${h*.16}" fill="rgba(0,0,0,.18)"/><rect width="${w}" height="${h}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3"/>${label?`<text x="${w/2}" y="${h*.36}" font-size="${Math.min(w,h)*.2}" font-weight="700" fill="rgba(0,0,0,.55)" text-anchor="middle">${label}</text>`:''}</g>`}
function capsule(r=1,c1=RED,c2='#f4f1ea'){return `<g transform="scale(${r})"><rect x="-150" y="-62" width="300" height="124" rx="62" fill="${c2}"/><path d="M0 -62 L88 -62 A62 62 0 0 1 88 62 L0 62Z" fill="${c1}"/><rect x="-120" y="-44" width="90" height="16" rx="8" fill="rgba(255,255,255,.55)"/></g>`}
function ecgPath(x0,x1,y,beats,amp){let d=`M${x0} ${y}`;const w=(x1-x0)/beats;for(let i=0;i<beats;i++){const b=x0+i*w;d+=` L${b+w*.35} ${y} L${b+w*.42} ${y-amp*.2} L${b+w*.48} ${y+amp*.25} L${b+w*.53} ${y-amp} L${b+w*.6} ${y+amp*.5} L${b+w*.66} ${y} L${b+w} ${y}`}return d}

/* ---------- scenes ---------- */
const S={};
function eyes(P,c){return `<g id="${P}-eyes"><ellipse cx="-18" cy="6" rx="5" ry="6.5" fill="${c}"/><ellipse cx="18" cy="6" rx="5" ry="6.5" fill="${c}"/></g>`}

  const skin='#e8b48c',shirt='#f2efe8';

  <rect x="-80" y="-20" width="160" height="230" rx="26" fill="#262636"/>

  <path d="M-70 430 L70 430" stroke="#1b1b26" stroke-width="12" stroke-linecap="round"/>
  <circle cx="-70" cy="436" r="9" fill="#111"/><circle cx="70" cy="436" r="9" fill="#111"/><circle cx="0" cy="436" r="9" fill="#111"/>
  <rect x="-58" y="200" width="116" height="52" rx="20" fill="#2f3a5a"/>
  <rect x="-52" y="236" width="38" height="146" rx="14" fill="#2f3a5a"/><rect x="14" y="236" width="38" height="146" rx="14" fill="#2f3a5a"/>

  <path d="M-62 215 L-54 82 Q-52 60 -30 55 L30 55 Q52 60 54 82 L62 215 Z" fill="${shirt}"/>

  <g><path d="M-50 86 L-66 160 L-42 214" fill="none" stroke="${shirt}" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-40" cy="218" r="13" fill="${skin}"/></g>
  <g id="N-armDown"><path d="M50 86 L66 160 L42 214" fill="none" stroke="${shirt}" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="218" r="13" fill="${skin}"/></g>
  <g id="N-armHold"><path d="M50 86 L84 150 L66 74" fill="none" stroke="${shirt}" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
     <g id="N-bottle"><rect x="50" y="18" width="38" height="52" rx="10" fill="#f6f3ea"/><rect x="52" y="8" width="34" height="14" rx="4" fill="#3f8a3a"/><rect x="50" y="34" width="38" height="20" fill="#5aa84a"/><text x="69" y="49" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">Mg</text></g>
     <g id="N-capsule"><rect x="54" y="40" width="34" height="16" rx="8" fill="#f2a33a"/><rect x="54" y="40" width="17" height="16" rx="8" fill="#fbd27a"/></g>

  <g id="N-armScratch"><path d="M50 86 L88 120 L52 -30" fill="none" stroke="${shirt}" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="-36" r="13" fill="${skin}"/></g>
  <circle cx="-50" cy="6" r="10" fill="${skin}"/><circle cx="50" cy="6" r="10" fill="${skin}"/>

  <path d="M-53 2 Q-58 -62 0 -62 Q58 -62 53 2 Q46 -30 14 -32 Q-14 -40 -53 2 Z" fill="#1d1b22"/>
  ${eyes('N','#222')}
  <g id="N-brows"><path id="N-bl" d="M-27 -10 L-10 -12" stroke="#1d1b22" stroke-width="5" stroke-linecap="round"/><path id="N-br" d="M10 -12 L27 -10" stroke="#1d1b22" stroke-width="5" stroke-linecap="round"/></g>
  <path id="N-mc" d="M-10 28 Q0 33 10 28" stroke="#7a3a2a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse id="N-mo" cx="0" cy="30" rx="8" ry="6" fill="#6b2a2a"/>
  <g id="N-pain"><path d="M-26 0 L-12 6 L-26 12 M26 0 L12 6 L26 12" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 -30 Q48 -14 40 -6 Q32 -14 40 -30Z" fill="#7ac8ff"/></g>
  <g id="N-zap" stroke="#e0162b" stroke-width="7" fill="none" stroke-linejoin="round"><path d="M-80 280 l24 12 -18 12 24 12"/><path d="M0 270 l-24 12 18 12 -24 12"/><path d="M-82 330 l24 8 -18 12 24 8"/></g>
  <text id="N-q" x="60" y="-70" font-size="70" font-weight="700" fill="#ffd24a">?</text>
  <text id="N-x" x="44" y="-66" font-size="64" font-weight="700" fill="#ffd24a">!?</text>
  </g>`;
}

  return `<g id="U">

  <ellipse cx="-36" cy="382" rx="26" ry="11" fill="#1f1a16"/><ellipse cx="36" cy="382" rx="26" ry="11" fill="#1f1a16"/>
  <rect x="-140" y="140" width="56" height="150" rx="24" fill="#2a5f4b"/><rect x="84" y="140" width="56" height="150" rx="24" fill="#2a5f4b"/>

/* ---------- scenes ---------- */

S.room=function(){
  const r=rng(7);let city='',stars='';
  for(let i=0;i<16;i++){const bw=34+r()*46,bh=120+r()*300,x=550+i*32;city+=`<rect x="${x}" y="${770-bh}" width="${bw}" height="${bh}" fill="#171a3c"/>`;
    for(let yy=770-bh+14;yy<760;yy+=26)for(let xx=x+6;xx<x+bw-8;xx+=14)if(r()<.32)city+=`<rect x="${xx}" y="${yy}" width="6" height="10" fill="#ffd479" opacity="${.5+r()*.5}"/>`;}
  for(let i=0;i<34;i++)stars+=`<circle class="star" cx="${570+r()*450}" cy="${170+r()*300}" r="${1+r()*2.2}" fill="#fff" data-p="${r()*6}"/>`;
  let books='';const bc=['#c9563c','#e0a53a','#4f7fa8','#7a9a5a','#8a5aa0','#d9d0bb','#3f6a62'];
  for(let s=0;s<5;s++){let x=46;while(x<200){const w=14+r()*16,h=90+r()*40;books+=`<rect x="${x}" y="${386+s*150-h}" width="${w}" height="${h}" fill="${bc[Math.floor(r()*bc.length)]}"/>`;x+=w+3}}
  return `<svg viewBox="0 0 1080 1920"><defs>
   <linearGradient id="rg-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14183f"/><stop offset="1" stop-color="#3b2d6e"/></linearGradient>
   <linearGradient id="rg-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2148"/><stop offset="1" stop-color="#0f0c1e"/></linearGradient>
   <radialGradient id="rg-lamp" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/></radialGradient>
   <clipPath id="rc-win"><rect x="570" y="170" width="450" height="600"/></clipPath></defs>
   <g id="room-cam">
   <rect x="-800" y="-600" width="2700" height="1670" fill="#2c2550"/>
   <rect x="-800" y="1060" width="2700" height="1500" fill="url(#rg-floor)"/>
   <rect x="-800" y="1052" width="2700" height="10" fill="#3a3168"/>
   <rect x="560" y="160" width="470" height="620" fill="#3d3570"/>
   <g clip-path="url(#rc-win)"><rect x="570" y="170" width="450" height="600" fill="url(#rg-glass)"/>${stars}
     <path d="M940 250 A40 40 0 1 0 975 310 A32 32 0 1 1 940 250Z" fill="#f4ecd0"/>${city}</g>
   <rect x="792" y="170" width="6" height="600" fill="#3d3570"/>
   <path d="M530 150 L590 150 Q575 480 600 800 L530 800 Z" fill="#5b3f86"/><path d="M1060 150 L1000 150 Q1015 480 990 800 L1060 800 Z" fill="#5b3f86"/>
   <rect x="30" y="230" width="190" height="830" fill="#3a2a22"/><rect x="40" y="240" width="170" height="810" fill="#2a1e18"/>
